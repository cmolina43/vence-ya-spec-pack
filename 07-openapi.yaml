  # ───────────────────────────── Cuotas y pagos (HU-006, HU-007) ─────────────────────────────
  /cuotas/{cuotaId}:
    get:
      operationId: obtenerCuota
      tags: [Pagos]
      summary: Obtener una cuota con su saldo vigente
      description: |
        **HU-006, HU-011.** Consulta autorizada del saldo y estado vigentes (la que usa la interfaz tras un
        rechazo `IMPORTE_SUPERA_SALDO`). Incluye `version` para el control de concurrencia de pagos y
        reprogramaciones y `fechaMinimaPago` (mayor fecha de pagos vigentes o la emisión).
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR.
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - $ref: '#/components/parameters/CuotaId'
      responses:
        '200':
          description: Cuota.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleCuota' }
              examples:
                cuota:
                  value:
                    id: 9001
                    comprobanteId: 501
                    numeroDocumento: F001-00045
                    sentido: POR_COBRAR
                    contacto: { id: 42, nombre: DISTRIBUIDORA LIMA, estado: ACTIVO }
                    numero: 1
                    moneda: PEN
                    importe: "1000.00"
                    saldo: "600.00"
                    vencimientoOriginal: "2026-11-03"
                    fechaEfectivaVencimiento: "2026-11-03"
                    estado: VENCIDA
                    diasAtraso: 6
                    reprogramada: false
                    fechaMinimaPago: "2026-11-08"
                    fechaCalculo: "2026-11-09"
                    version: 4
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /cuotas/{cuotaId}/pagos:
    get:
      operationId: listarPagosCuota
      tags: [Pagos]
      summary: Listar los pagos de una cuota
      description: |
        **HU-006, HU-007.** Pagos de la cuota, vigentes y anulados, ordenados por fecha de pago y orden de registro.
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR.
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - $ref: '#/components/parameters/CuotaId'
      responses:
        '200':
          description: Pagos de la cuota.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pago' }
              examples:
                pagos:
                  value:
                    - id: 1001
                      cuotaId: 9001
                      importe: "400.00"
                      moneda: PEN
                      fechaPago: "2026-11-09"
                      estado: VIGENTE
                      registradoPor: { id: 15, correo: luis.ramos@example.com }
                      creadoEn: "2026-11-09T11:05:12-05:00"
                      anulacion: null
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      operationId: registrarPago
      tags: [Pagos]
      summary: Registrar un cobro o pago sobre una cuota
      description: |
        **HU-006.** Registra un pago confirmado e inmutable (RN-063, PRINCIPIO-006) sobre una sola cuota.
        Reglas: importe mayor que 0, en la moneda de la cuota, no mayor que el saldo vigente
        (`IMPORTE_SUPERA_SALDO`, sin reparto entre cuotas, RN-092); fecha de pago no anterior a la emisión, no
        posterior a la fecha de cálculo y no anterior a la mayor fecha de los pagos vigentes (se admite la misma
        fecha, RN-089); el comprobante no debe estar anulado. Guarda la fecha de pago y, aparte, la fecha y hora de
        creación. Si el saldo queda en 0, la cuota pasa a CANCELADA; el vencimiento acordado no cambia (RN-088).
        **Idempotencia (RN-156):** la cabecera `Clave-Idempotencia` es obligatoria y estable entre reintentos.
        Repetir la misma clave con los mismos datos devuelve `200` con el pago original, sin crear otro; con datos
        distintos, `409 CLAVE_IDEMPOTENCIA_REUTILIZADA`. **Concurrencia:** la cuota se bloquea al guardar; `versionCuota`
        distinta de la vigente responde `409 DATOS_DESACTUALIZADOS` sin consumir la clave (RN-160).
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR.
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - $ref: '#/components/parameters/CuotaId'
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - $ref: '#/components/parameters/TokenCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudPago' }
            examples:
              parcial:
                value: { importe: "400.00", moneda: PEN, fechaPago: "2026-11-09", versionCuota: 3 }
      responses:
        '201':
          description: Pago registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaPago' }
              examples:
                registrado:
                  $ref: '#/components/examples/RespuestaPago1001'
        '200':
          description: Reintento de una operación ya completada (misma clave y mismos datos); devuelve el pago original.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaPago' }
              examples:
                repetido:
                  $ref: '#/components/examples/RespuestaPago1001'
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Comprobante anulado, datos desactualizados (incluido el pago concurrente) o clave reutilizada con otros datos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                desactualizado:
                  $ref: '#/components/examples/ErrorDatosDesactualizados'
                claveReutilizada:
                  value:
                    codigo: CLAVE_IDEMPOTENCIA_REUTILIZADA
                    mensaje: La clave de operación ya se usó con otros datos.
                    idSolicitud: 5a9b0c1d-2e3f-4a4b-6c5d-7e8f9a0b1c20
                comprobanteAnulado:
                  value:
                    codigo: COMPROBANTE_ANULADO
                    mensaje: El comprobante está anulado y es de solo lectura.
                    idSolicitud: 5a9b0c1d-2e3f-4a4b-6c5d-7e8f9a0b1c21
        '422':
          description: Importe o fecha de pago inválidos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                superaSaldo:
                  value:
                    codigo: IMPORTE_SUPERA_SALDO
                    mensaje: El importe supera el saldo de la cuota. Consulta el saldo vigente.
                    idSolicitud: 5a9b0c1d-2e3f-4a4b-6c5d-7e8f9a0b1c22
                fechaAnterior:
                  value:
                    codigo: VALIDACION_FALLIDA
                    mensaje: La solicitud tiene datos que no cumplen las reglas.
                    detalles:
                      - { campo: fechaPago, codigo: FECHA_ANTERIOR_A_ULTIMO_PAGO, mensaje: La fecha de pago es anterior al último pago vigente de la cuota. }
                    idSolicitud: 5a9b0c1d-2e3f-4a4b-6c5d-7e8f9a0b1c23
                monedaDistinta:
                  value:
                    codigo: VALIDACION_FALLIDA
                    mensaje: La solicitud tiene datos que no cumplen las reglas.
                    detalles:
                      - { campo: moneda, codigo: MONEDA_DISTINTA_CUOTA, mensaje: La moneda del pago debe ser la de la cuota. }
                    idSolicitud: 5a9b0c1d-2e3f-4a4b-6c5d-7e8f9a0b1c24
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /pagos/{pagoId}/anulacion:
    post:
      operationId: anularPago
      tags: [Pagos]
      summary: Anular un pago
      description: |
        **HU-007.** Crea un registro de anulación que referencia el pago, con motivo, usuario y fecha y hora; el
        pago no se modifica (PRINCIPIO-006). El saldo y el estado de la cuota se recalculan (la cuota CANCELADA
        vuelve a PENDIENTE o VENCIDA según su fecha efectiva). Total, irreversible y única: dos anulaciones
        simultáneas producen una sola (índice único sobre `pagoId`). Mismas reglas de `motivo` que la anulación
        de comprobantes.
        **Roles:** SUPERVISOR, ADMINISTRADOR.
      x-roles: [SUPERVISOR, ADMINISTRADOR]
      parameters:
        - $ref: '#/components/parameters/PagoId'
        - $ref: '#/components/parameters/TokenCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudAnulacion' }
            examples:
              anular:
                value: { motivo: "Importe digitado erróneamente" }
      responses:
        '201':
          description: Pago anulado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaAnulacionPago' }
              examples:
                anulado:
                  value:
                    anulacion:
                      id: 88
                      motivo: IMPORTE DIGITADO ERRÓNEAMENTE
                      anuladoPor: { id: 18, correo: jefe.cobranzas@example.com }
                      anuladoEn: "2026-11-09T16:10:00-05:00"
                    pagoId: 1001
                    cuota: { id: 9001, saldo: "1000.00", estado: VENCIDA, version: 5 }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/PermisoDenegado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El pago ya está anulado o su comprobante está anulado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                yaAnulado:
                  value:
                    codigo: YA_ANULADO
                    mensaje: El pago ya está anulado.
                    idSolicitud: 6b0c1d2e-3f4a-4b5c-7d6e-8f9a0b1c2d30
        '422':
          description: Motivo inválido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                motivoVacio:
                  $ref: '#/components/examples/ErrorMotivoVacio'
        '500': { $ref: '#/components/responses/ErrorInterno' }

  # ───────────────────────────── Reprogramaciones (HU-011, Should S1) ─────────────────────────────
  /cuotas/{cuotaId}/promesas:
    get:
      operationId: listarPromesasCuota
      tags: [Reprogramaciones]
      summary: Listar las promesas de pago de una cuota
      description: |
        **HU-011 (Should S1, posterior al MVP).** Historial de promesas de la cuota, de la más reciente a la más
        antigua. El estado ACTIVA, CUMPLIDA o INCUMPLIDA se calcula con la fecha de cálculo; REEMPLAZADA es
        persistente. Mientras S1 no se entregue, la ruta responde `404`.
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR.
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - $ref: '#/components/parameters/CuotaId'
      responses:
        '200':
          description: Promesas de la cuota.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PromesaPago' }
              examples:
                historial:
                  value:
                    - id: 301
                      fechaPrometida: "2026-11-30"
                      estado: ACTIVA
                      registradaPor: { id: 15, correo: luis.ramos@example.com }
                      registradaEn: "2026-11-15T10:00:00-05:00"
                    - id: 300
                      fechaPrometida: "2026-11-20"
                      estado: REEMPLAZADA
                      registradaPor: { id: 15, correo: luis.ramos@example.com }
                      registradaEn: "2026-11-08T10:00:00-05:00"
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      operationId: reprogramarCuota
      tags: [Reprogramaciones]
      summary: Reprogramar una cuota con promesa de pago
      description: |
        **HU-011 (Should S1, posterior al MVP).** Registra una promesa ACTIVA sin aprobación previa; la anterior
        queda REEMPLAZADA y el vencimiento original se conserva. Condiciones al guardar: saldo mayor que 0,
        comprobante no anulado, `fechaPrometida` posterior a la fecha efectiva vigente y no anterior a la fecha de
        cálculo (RN-033, RN-080, RN-118). La cuota queda marcada como reprogramada. `versionCuota` detecta un pago
        concurrente (RN-160). Una sola promesa ACTIVA por cuota (índice único parcial).
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR.
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - $ref: '#/components/parameters/CuotaId'
        - $ref: '#/components/parameters/TokenCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudReprogramacion' }
            examples:
              reprogramar:
                value: { fechaPrometida: "2026-11-20", versionCuota: 4 }
      responses:
        '201':
          description: Promesa registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaReprogramacion' }
              examples:
                registrada:
                  value:
                    promesa:
                      id: 300
                      fechaPrometida: "2026-11-20"
                      estado: ACTIVA
                      registradaPor: { id: 15, correo: luis.ramos@example.com }
                      registradaEn: "2026-11-08T10:00:00-05:00"
                    cuota:
                      id: 9001
                      vencimientoOriginal: "2026-11-10"
                      fechaEfectivaVencimiento: "2026-11-20"
                      estado: PENDIENTE
                      reprogramada: true
                      version: 5
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Cuota sin saldo, comprobante anulado o datos desactualizados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                sinSaldo:
                  value:
                    codigo: CUOTA_SIN_SALDO
