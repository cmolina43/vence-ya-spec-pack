  # ───────────────────────────── Contactos (HU-004) ─────────────────────────────
  /contactos:
    get:
      operationId: listarContactos
      tags: [Contactos]
      summary: Listar o buscar contactos
      description: |
        **HU-004, HU-005.** Lista paginada del catálogo de la empresa, ordenada por nombre. `busqueda` filtra por
        coincidencia parcial del nombre; no busca por correo (alcance vigente). `seleccionables=true`
        devuelve solo contactos ACTIVOS, para registrar comprobantes.
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR.
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - name: busqueda
          in: query
          description: Texto parcial del nombre (se compara en mayúsculas).
          schema: { type: string, maxLength: 250 }
        - name: estado
          in: query
          schema: { $ref: '#/components/schemas/EstadoContacto' }
        - name: seleccionables
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
      responses:
        '200':
          description: Página de contactos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaContactos' }
              examples:
                pagina:
                  value:
                    elementos:
                      - id: 42
                        nombre: DISTRIBUIDORA LIMA
                        correo: ventas.distlima@example.com
                        telefono: null
                        direccion: null
                        estado: ACTIVO
                        tieneComprobantes: false
                        creadoEn: "2026-11-09T09:30:00-05:00"
                        actualizadoEn: "2026-11-09T09:30:00-05:00"
                        version: 1
                    paginacion: { pagina: 1, tamanoPagina: 20, totalElementos: 1, totalPaginas: 1 }
                vacia:
                  value:
                    elementos: []
                    paginacion: { pagina: 1, tamanoPagina: 20, totalElementos: 0, totalPaginas: 0 }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      operationId: crearContacto
      tags: [Contactos]
      summary: Crear un contacto
      description: |
        **HU-004.** Registra un contacto ACTIVO. `nombre`: TRIM, espacios internos reducidos a uno, mayúsculas,
        1 a 250 caracteres, al menos una letra; letras (con tilde, ñ, ü), dígitos, espacios y `. , & - ' ( ) /`
        (RN-162). `correo`: TRIM, minúsculas, formato válido con dominio con punto, 1 a 250 caracteres, único en la
        empresa incluidos los DESACTIVADOS (RN-127). `telefono` y `direccion` opcionales. No se piden DNI, RUC,
        cuenta ni CCI.
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR.
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - $ref: '#/components/parameters/TokenCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudContacto' }
            examples:
              minimo:
                value: { nombre: "  Distribuidora   Lima  ", correo: " Ventas.DistLima@Example.com " }
      responses:
        '201':
          description: Contacto creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contacto' }
              examples:
                creado:
                  $ref: '#/components/examples/ContactoDistribuidora'
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409':
          description: El correo ya pertenece a otro contacto de la empresa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                correoDuplicado:
                  $ref: '#/components/examples/ErrorCorreoContactoDuplicado'
        '422':
          description: Nombre o correo inválidos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                nombreSinLetras:
                  value:
                    codigo: VALIDACION_FALLIDA
                    mensaje: La solicitud tiene datos que no cumplen las reglas.
                    detalles:
                      - { campo: nombre, codigo: SIN_LETRAS, mensaje: El nombre debe contener al menos una letra. }
                    idSolicitud: 7e1f2a3b-4c5d-4e6f-8a7b-9c0d1e2f3a40
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /contactos/{contactoId}:
    get:
      operationId: obtenerContacto
      tags: [Contactos]
      summary: Obtener un contacto
      description: |
        **HU-004.** Detalle del contacto de la empresa de la sesión; de otra empresa, `404`.
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR.
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - $ref: '#/components/parameters/ContactoId'
      responses:
        '200':
          description: Contacto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contacto' }
              examples:
                contacto:
                  $ref: '#/components/examples/ContactoDistribuidora'
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      operationId: editarContacto
      tags: [Contactos]
      summary: Editar un contacto
      description: |
        **HU-004.** Cambia nombre, correo, teléfono o dirección de un contacto ACTIVO o DESACTIVADO, con las mismas
        validaciones del registro (RN-129). Guarda por cada campo cambiado el valor anterior, el nuevo, el usuario
        y la fecha y hora. `telefono` o `direccion` en `null`
        los borra. Los avisos posteriores usan el correo nuevo.
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR.
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - $ref: '#/components/parameters/ContactoId'
        - $ref: '#/components/parameters/TokenCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudEdicionContacto' }
            examples:
              telefono:
                value: { telefono: "912345678", version: 1 }
      responses:
        '200':
          description: Contacto editado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contacto' }
              examples:
                editado:
                  value:
                    id: 42
                    nombre: DISTRIBUIDORA LIMA
                    correo: ventas.distlima@example.com
                    telefono: "912345678"
                    direccion: null
                    estado: ACTIVO
                    tieneComprobantes: true
                    creadoEn: "2026-11-09T09:30:00-05:00"
                    actualizadoEn: "2026-11-09T12:00:00-05:00"
                    version: 2
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Correo duplicado en la empresa o datos desactualizados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                correoDuplicado:
                  $ref: '#/components/examples/ErrorCorreoContactoDuplicado'
                desactualizado:
                  $ref: '#/components/examples/ErrorDatosDesactualizados'
        '422': { $ref: '#/components/responses/ValidacionFallida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    delete:
      operationId: eliminarContacto
      tags: [Contactos]
      summary: Eliminar un contacto sin comprobantes
      description: |
        **HU-004.** Elimina el contacto solo si no tiene ningún comprobante, incluidos los anulados (RN-130). La
        interfaz pide confirmación antes de llamar. La comprobación y la eliminación son atómicas frente al
        registro concurrente de un comprobante (RN-160). Libera el correo para un contacto nuevo. El tratamiento
        de su historial de ediciones está pendiente (pregunta 51, QA-13).
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR.
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - $ref: '#/components/parameters/ContactoId'
        - $ref: '#/components/parameters/TokenCsrf'
      responses:
        '204':
          description: Contacto eliminado.
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El contacto tiene comprobantes; se ofrece desactivarlo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                conComprobantes:
                  value:
                    codigo: CONTACTO_CON_COMPROBANTES
                    mensaje: El contacto tiene comprobantes registrados y no puede eliminarse. Puedes desactivarlo.
                    idSolicitud: 8f2a3b4c-5d6e-4f7a-9b8c-0d1e2f3a4b50
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /contactos/{contactoId}/desactivacion:
    post:
      operationId: desactivarContacto
      tags: [Contactos]
      summary: Desactivar un contacto
      description: |
        **HU-004.** El contacto pasa a DESACTIVADO: deja de ser seleccionable para comprobantes nuevos, pero sus
        cuotas con saldo siguen en la lista de cuotas por avisar.
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR.
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - $ref: '#/components/parameters/ContactoId'
        - $ref: '#/components/parameters/TokenCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudConVersion' }
            examples:
              desactivar:
                value: { version: 2 }
      responses:
        '200':
          description: Contacto desactivado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contacto' }
              examples:
                desactivado:
                  value:
                    id: 42
                    nombre: DISTRIBUIDORA LIMA
                    correo: ventas.distlima@example.com
                    telefono: "912345678"
                    direccion: null
                    estado: DESACTIVADO
                    tieneComprobantes: true
                    creadoEn: "2026-11-09T09:30:00-05:00"
                    actualizadoEn: "2026-11-09T13:00:00-05:00"
                    version: 3
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Ya desactivado o datos desactualizados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                yaDesactivado:
                  value:
                    codigo: ESTADO_NO_PERMITE_OPERACION
                    mensaje: El contacto ya está desactivado.
                    idSolicitud: 9a3b4c5d-6e7f-4a8b-0c9d-1e2f3a4b5c60
        '422': { $ref: '#/components/responses/ValidacionFallida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /contactos/{contactoId}/reactivacion:
    post:
      operationId: reactivarContacto
      tags: [Contactos]
      summary: Reactivar un contacto
      description: |
        **HU-004.** El contacto vuelve a ACTIVO y a ser seleccionable.
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR.
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - $ref: '#/components/parameters/ContactoId'
        - $ref: '#/components/parameters/TokenCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudConVersion' }
            examples:
              reactivar:
                value: { version: 3 }
      responses:
        '200':
          description: Contacto reactivado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contacto' }
              examples:
                reactivado:
                  value:
                    id: 42
                    nombre: DISTRIBUIDORA LIMA
                    correo: ventas.distlima@example.com
                    telefono: "912345678"
                    direccion: null
                    estado: ACTIVO
                    tieneComprobantes: true
                    creadoEn: "2026-11-09T09:30:00-05:00"
                    actualizadoEn: "2026-11-09T14:00:00-05:00"
                    version: 4
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Ya activo o datos desactualizados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                yaActivo:
                  value:
                    codigo: ESTADO_NO_PERMITE_OPERACION
                    mensaje: El contacto ya está activo.
                    idSolicitud: 0b4c5d6e-7f8a-4b9c-1d0e-2f3a4b5c6d70
        '422': { $ref: '#/components/responses/ValidacionFallida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  # ───────────────────────────── Comprobantes y cuotas (HU-005, HU-007) ─────────────────────────────
  /comprobantes/propuesta-cuotas:
    post:
      operationId: proponerCuotas
      tags: [Comprobantes]
      summary: Calcular la propuesta de cuotas
      description: |
        **HU-005.** Cálculo puro sin persistencia (RN-015). `CUOTAS`: de 2 a 120 cuotas mensuales; la cuota 1 vence
        un mes calendario después de la emisión y las siguientes el mismo día (o el último día del mes si no
        existe). Importes proporcionales en céntimos; el residuo va a la última cuota (S/ 1,000.00 en 3 →
        333.33, 333.33, 333.34). La cantidad no puede superar los céntimos del total. `PAGO_UNICO`: una cuota con
        `fechaVencimiento`. La fecha de emisión no puede ser posterior a la fecha de cálculo.
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR.
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - $ref: '#/components/parameters/TokenCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudPropuestaCuotas' }
            examples:
              tresCuotas:
                value: { total: "1000.00", moneda: PEN, fechaEmision: "2026-11-04", modalidad: CUOTAS, cantidadCuotas: 3 }
      responses:
        '200':
          description: Propuesta de cuotas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropuestaCuotas' }
              examples:
                tresCuotas:
                  value:
                    cuotas:
                      - { numero: 1, importe: "333.33", fechaVencimiento: "2026-12-04" }
                      - { numero: 2, importe: "333.33", fechaVencimiento: "2027-01-04" }
                      - { numero: 3, importe: "333.34", fechaVencimiento: "2027-02-04" }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '422':
          description: Cantidad de cuotas inválida o superior a los céntimos del total, o fechas inválidas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                maximoCuotas:
                  value:
                    codigo: VALIDACION_FALLIDA
                    mensaje: La solicitud tiene datos que no cumplen las reglas.
                    detalles:
                      - { campo: cantidadCuotas, codigo: CUOTAS_SUPERAN_CENTIMOS, mensaje: Para este total el máximo posible es 2 cuotas. }
                    idSolicitud: 1c5d6e7f-8a9b-4c0d-2e1f-3a4b5c6d7e80

  /comprobantes:
    get:
      operationId: listarComprobantes
      tags: [Comprobantes]
      summary: Listar comprobantes
      description: |
        **HU-005.** Lista paginada de comprobantes de la empresa, ordenada por fecha de emisión descendente.
        Excluye anulados salvo `incluirAnulados=true`.
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR.
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - name: sentido
          in: query
          schema: { $ref: '#/components/schemas/Sentido' }
        - name: contactoId
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: numeroDocumento
          in: query
          description: Coincidencia exacta tras TRIM y mayúsculas.
          schema: { type: string, maxLength: 30 }
        - name: incluirAnulados
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
      responses:
        '200':
          description: Página de comprobantes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaComprobantes' }
              examples:
                pagina:
                  value:
                    elementos:
                      - id: 501
                        contacto: { id: 42, nombre: DISTRIBUIDORA LIMA, estado: ACTIVO }
                        sentido: POR_COBRAR
                        numeroDocumento: F001-00045
                        moneda: USD
                        total: "3000.00"
                        saldo: "3000.00"
                        fechaEmision: "2026-11-04"
                        cantidadCuotas: 3
                        estado: VIGENTE
                    paginacion: { pagina: 1, tamanoPagina: 20, totalElementos: 1, totalPaginas: 1 }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      operationId: registrarComprobante
      tags: [Comprobantes]
      summary: Registrar un comprobante con sus cuotas
      description: |
        **HU-005.** Registra el comprobante y todas sus cuotas en una transacción. Validaciones: contacto ACTIVO de
        la empresa (`404` si es de otra o no existe; `422` si está DESACTIVADO); `numeroDocumento` con TRIM y
        mayúsculas, 1 a 30 caracteres (letras, dígitos, `-` y `_`, sin espacios); único entre no anulados por
        empresa en `POR_COBRAR` y por proveedor en `POR_PAGAR` (índice único parcial); moneda `PEN` o `USD` sin
        conversión; total mayor que 0 y hasta 999999999999.99; emisión no posterior a la fecha de cálculo;
        cuotas de 1 a 120, con vencimientos posteriores a la emisión y estrictamente crecientes, y suma igual al
        total (el sistema no ajusta cuotas) (RN-015 a RN-020, RN-131 a RN-133, RN-153, RN-154).
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR.
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - $ref: '#/components/parameters/TokenCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudComprobante' }
            examples:
              enCuotasUsd:
                value:
                  contactoId: 42
                  sentido: POR_COBRAR
                  numeroDocumento: " f001-00045 "
                  moneda: USD
                  total: "3000.00"
                  fechaEmision: "2026-11-04"
                  modalidad: CUOTAS
                  cuotas:
                    - { numero: 1, importe: "1000.00", fechaVencimiento: "2026-12-04" }
                    - { numero: 2, importe: "1000.00", fechaVencimiento: "2027-01-04" }
                    - { numero: 3, importe: "1000.00", fechaVencimiento: "2027-02-04" }
              pagoUnico:
                value:
                  contactoId: 42
                  sentido: POR_PAGAR
                  numeroDocumento: E001-00120
                  moneda: PEN
                  total: "1500.00"
                  fechaEmision: "2026-11-09"
                  modalidad: PAGO_UNICO
                  cuotas:
                    - { numero: 1, importe: "1500.00", fechaVencimiento: "2026-12-15" }
      responses:
        '201':
          description: Comprobante registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comprobante' }
              examples:
                registrado:
                  $ref: '#/components/examples/ComprobanteF00145'
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Número de documento duplicado entre comprobantes no anulados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
