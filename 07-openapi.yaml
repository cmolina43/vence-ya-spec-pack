openapi: 3.1.0
info:
  title: API de VenceYa
  version: 1.0.0
  summary: Contratos REST de VenceYa (cuentas por cobrar y por pagar de pymes peruanas).
  description: |
    Fuente oficial de los contratos REST de VenceYa. El resumen y el inventario de endpoints están en
    `07-architecture.md` (sección 4, «API Contracts»). Este archivo y ese inventario deben contener exactamente
    los mismos endpoints.

    **Convenciones generales**

    - **Prefijo y versión:** todas las rutas cuelgan de `/api/v1`.
    - **Autenticación:** sesión opaca en servidor, transportada en la cookie `venceya_sesion`
      (`HttpOnly`, `Secure`, `SameSite=Strict`). Toda operación que no sea GET exige además la cabecera
      `X-Token-CSRF` con el valor recibido al iniciar sesión. Las operaciones internas del equipo de VenceYa
      (`/interno/...`) usan un token de operaciones (`Authorization: Bearer`) y solo se publican en la red privada.
    - **Sesiones (RN-149):** 30 minutos sin actividad y 12 horas absolutas. Las peticiones automáticas
      (sondeos o refrescos) envían `X-Peticion-Automatica: true` y no renuevan la inactividad.
    - **Aislamiento por empresa (PRINCIPIO-003, RN-008):** la empresa siempre sale de la sesión. Un recurso de
      otra empresa responde `404` con el mismo cuerpo que un recurso inexistente.
    - **Formato de error único:** esquema `Error` (`codigo`, `mensaje`, `detalles`, `idSolicitud`). Los mensajes
      nunca repiten los valores ingresados ni contienen datos personales o importes (PRINCIPIO-005).
    - **Trazabilidad de accesos (RN-263 a RN-266):** el inicio y cierre de sesión y cada consulta, alta,
      edición, anulación, eliminación o exportación de contactos, comprobantes, cuotas, pagos, avisos o usuarios
      generan un registro de interacción lógica sin datos personales. Si no puede guardarse, la operación
      responde `500` sin efectos ni datos. No cambia los contratos de las operaciones.
    - **Códigos de estado:** `400` cuerpo JSON mal formado o parámetros de ruta o de consulta inválidos;
      `401` sin sesión vigente o credenciales inválidas; `403` rol sin permiso (RN-060) o contrato de la
      empresa terminado (`CONTRATO_TERMINADO`, RN-152; una sesión abierta recibe `401` con ese mismo código
      y queda cerrada); `404` recurso
      inexistente o de otra empresa; `409` conflicto con el estado vigente (duplicado, datos desactualizados,
      estado que no lo permite, concurrencia); `422` el cuerpo incumple las reglas de contenido o de negocio
      (RN-162 y demás). Un rechazo nunca deja efectos parciales (RN-160).
    - **Paginación:** `pagina` (desde 1) y `tamanoPagina` (1 a 100, 20 por defecto); la respuesta trae
      `elementos` y `paginacion`.
    - **Importes:** cadena decimal canónica con punto decimal y sin separador de miles, hasta 12 dígitos
      enteros y 2 decimales (`"1000.50"`). Las respuestas siempre usan 2 decimales. El formato peruano
      `1,000.50` es responsabilidad exclusiva de la interfaz (RN-153). Moneda en ISO 4217: `PEN` (S/) o `USD` (US$).
    - **Fechas:** fechas de negocio `AAAA-MM-DD` (`format: date`); instantes ISO 8601 con desfase de
      America/Lima (`2026-11-09T08:15:30-05:00`). La fecha de cálculo la fija el servidor (RN-198).
    - **Idioma:** rutas, campos, esquemas y `operationId` en español (PRINCIPIO-001). Los ejemplos usan datos
      ficticios y correos del dominio `example.com` (PRINCIPIO-005).
  contact:
    name: Equipo de VenceYa
    email: equipo@example.com
servers:
  - url: https://{host}/api/v1
    description: Instalación en la nube o local (on-premise).
    variables:
      host:
        default: api.example.com
tags:
  - name: Autenticacion
    description: Activación de cuentas, inicio y cierre de sesión, recuperación de contraseña (HU-002).
  - name: OperacionesInternas
    description: Procedimientos del equipo de VenceYa; no disponibles para roles de empresa (HU-001).
  - name: Usuarios
    description: Administración de usuarios y roles de la empresa (HU-003).
  - name: MiCuenta
    description: Preferencias personales del usuario autenticado (HU-008).
  - name: ConfiguracionEmpresa
    description: Correo administrativo, moneda por defecto y listas de copias (HU-008, HU-009).
  - name: Contactos
    description: Catálogo de clientes y proveedores (HU-004).
  - name: Comprobantes
    description: Comprobantes a crédito y sus cuotas (HU-005, HU-007).
  - name: Pagos
    description: Registro y anulación de cobros y pagos (HU-006, HU-007).
  - name: Reprogramaciones
    description: Promesas de pago sobre cuotas (HU-011, Should S1).
  - name: Historiales
    description: Historial cronológico de cuotas (HU-017, compartido entre S1 y S4).
  - name: Panel
    description: Panel de cartera y tiempo promedio de cobro (HU-008, HU-012).
  - name: Avisos
    description: Cuotas por avisar, envío de avisos y bandeja interna (HU-010).
security:
  - sesionCookie: []

paths:
  # ───────────────────────────── Autenticación (HU-002) ─────────────────────────────
  /autenticacion/inicio-sesion:
    post:
      operationId: iniciarSesion
      tags: [Autenticacion]
      summary: Iniciar sesión con correo y contraseña
      description: |
        **HU-002.** Normaliza el correo (TRIM y minúsculas), localiza la cuenta por el correo normalizado y
        verifica la contraseña (Argon2id) sin recortarla. Solo un usuario ACTIVO inicia sesión. Tras 5 fallos
        consecutivos la cuenta queda bloqueada 15 minutos (RN-103); durante el bloqueo todo intento se rechaza sin
        contarse ni prolongar el bloqueo. Correo inexistente, contraseña incorrecta, cuenta bloqueada, INVITADA o
        DESACTIVADA reciben la misma respuesta `401`. Un inicio correcto reinicia el contador de fallos.
        Si la contraseña es correcta pero la empresa tiene `terminacion_efectiva_en` menor o igual que el instante
        actual, responde `403 CONTRATO_TERMINADO` sin crear la sesión (RN-101, RN-152); con una contraseña
        incorrecta la respuesta sigue siendo la `401` neutra (RN-103).
        Responde con la cookie `venceya_sesion` y el token CSRF.
        **Roles:** público.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudInicioSesion' }
            examples:
              correcto:
                value: { correo: " Ana.Torres@Example.com ", contrasena: "cobranza segura 2026" }
      responses:
        '200':
          description: Sesión iniciada.
          headers:
            Set-Cookie:
              description: Cookie de sesión opaca (`HttpOnly; Secure; SameSite=Strict; Path=/api`).
              schema: { type: string }
              example: venceya_sesion=3q2+7w...; HttpOnly; Secure; SameSite=Strict; Path=/api
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionActual' }
              examples:
                administradora:
                  $ref: '#/components/examples/SesionAdministradora'
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401':
          description: Credenciales inválidas. Mismo cuerpo para correo inexistente, contraseña incorrecta, cuenta bloqueada o no ACTIVA.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                credencialesInvalidas:
                  value:
                    codigo: CREDENCIALES_INVALIDAS
                    mensaje: El correo o la contraseña no son válidos.
                    idSolicitud: 0b6f2c1e-6a51-4f0e-9d3b-2f8a7c1d9e10
        '403': { $ref: '#/components/responses/ContratoTerminado' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /autenticacion/cierre-sesion:
    post:
      operationId: cerrarSesion
      tags: [Autenticacion]
      summary: Cerrar la sesión actual
      description: |
        **HU-002.** Cierra la sesión vigente del dispositivo actual y elimina la cookie. Las demás sesiones del
        usuario siguen abiertas.
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR.
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - $ref: '#/components/parameters/TokenCsrf'
      responses:
        '204':
          description: Sesión cerrada.
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/CsrfInvalido' }

  /autenticacion/sesion:
    get:
      operationId: obtenerSesionActual
      tags: [Autenticacion]
      summary: Obtener la sesión vigente
      description: |
        **HU-002.** Devuelve el usuario autenticado, su rol, su empresa, los plazos de la sesión y el token CSRF.
        La SPA la usa al cargar. Con `X-Peticion-Automatica: true` no renueva el plazo de inactividad (RN-149).
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR.
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - $ref: '#/components/parameters/PeticionAutomatica'
      responses:
        '200':
          description: Sesión vigente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionActual' }
              examples:
                administradora:
                  $ref: '#/components/examples/SesionAdministradora'
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /autenticacion/activacion:
    post:
      operationId: activarCuenta
      tags: [Autenticacion]
      summary: Activar la cuenta desde el enlace de invitación
      description: |
        **HU-002.** Canjea el token de invitación y define la contraseña. La vigencia (72 horas, límite exclusivo)
        se comprueba al canjear con el reloj del servidor (RN-098). La contraseña tiene de 8 a 128 caracteres,
        admite cualquier carácter, no se recorta ni normaliza y no puede estar vacía ni ser solo espacios
        (RN-246 a RN-250). Un rechazo no consume el enlace y el usuario sigue INVITADO (RN-253). El usuario queda
        ACTIVO; no inicia sesión automáticamente. Si la empresa tiene la terminación contractual efectiva,
        responde `403 CONTRATO_TERMINADO` sin consumir el enlace (RN-152).
        **Roles:** público (portador del enlace).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudActivacion' }
            examples:
              correcto:
                value: { token: "inv_8sK2pQ7wZr4mN1xV6cB3", contrasena: "cobranza segura 2026" }
      responses:
        '204':
          description: Cuenta activada.
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '403': { $ref: '#/components/responses/ContratoTerminado' }
        '422':
          description: Enlace vencido, usado, revocado o inexistente, o contraseña inválida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                enlaceVencido:
                  value:
                    codigo: ENLACE_VENCIDO
                    mensaje: El enlace venció. Solicita a un administrador que reenvíe la invitación.
                    idSolicitud: 2d1c4a9e-1f0b-4c8e-8a6d-3b5e7f9a1c20
                contrasenaCorta:
                  value:
                    codigo: VALIDACION_FALLIDA
                    mensaje: La solicitud tiene datos que no cumplen las reglas.
                    detalles:
                      - { campo: contrasena, codigo: LONGITUD_MINIMA, mensaje: La contraseña debe tener al menos 8 caracteres. }
                    idSolicitud: 2d1c4a9e-1f0b-4c8e-8a6d-3b5e7f9a1c21

  /autenticacion/recuperacion:
    post:
      operationId: solicitarRecuperacionContrasena
      tags: [Autenticacion]
      summary: Solicitar un enlace de recuperación de contraseña
      description: |
        **HU-002.** Responde siempre `202` con el mismo cuerpo, exista o no la cuenta y sea cual sea su estado
        (RN-258). Solo envía el enlace (60 minutos) a un usuario ACTIVO. Emitir un enlace revoca el anterior
        (RN-259). Máximo 3 envíos por usuario en 60 minutos; una solicitud sobre el límite no envía correo ni
        revoca el enlace vigente (RN-260). Si la empresa del usuario tiene la terminación contractual efectiva,
        responde la misma `202` neutra sin enviar correo ni revocar enlaces (RN-152, RN-258).
        **Roles:** público.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudRecuperacion' }
            examples:
              solicitud:
                value: { correo: "ana.torres@example.com" }
      responses:
        '202':
          description: Respuesta neutra.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaRecuperacion' }
              examples:
                neutra:
                  value:
                    mensaje: Si el correo pertenece a una cuenta activa, recibirás un enlace para restablecer tu contraseña
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /autenticacion/recuperacion/restablecimiento:
    post:
      operationId: restablecerContrasena
      tags: [Autenticacion]
      summary: Definir una nueva contraseña con el enlace de recuperación
      description: |
        **HU-002.** Canjea el token de recuperación (60 minutos, límite exclusivo, un solo uso) y guarda un hash
        nuevo. Cierra todas las sesiones del usuario, desbloquea la cuenta y reinicia el contador de fallos
        (RN-102, RN-103). Se rechaza si el usuario ya no está ACTIVO. Un rechazo conserva la contraseña anterior y
        no consume el enlace (RN-253). Si la empresa tiene la terminación contractual efectiva, responde
        `403 CONTRATO_TERMINADO` sin consumir el enlace (RN-152).
        **Roles:** público (portador del enlace).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudRestablecimiento' }
            examples:
              correcto:
                value: { token: "rec_Q9aT4xL2mW7pZ0cV5bN8", contrasenaNueva: "nueva clave larga 2026" }
      responses:
        '204':
          description: Contraseña restablecida; todas las sesiones del usuario quedaron cerradas.
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '403': { $ref: '#/components/responses/ContratoTerminado' }
        '422':
          description: Enlace no válido o contraseña inválida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                enlaceNoValido:
                  value:
                    codigo: ENLACE_NO_VALIDO
                    mensaje: El enlace no es válido o ya fue utilizado. Solicita uno nuevo.
                    idSolicitud: 5e2a8c1d-7b3f-4d9a-9c0e-1a2b3c4d5e60

  # ───────────────────────────── Operaciones internas (HU-001) ─────────────────────────────
  /interno/empresas:
    post:
      operationId: registrarEmpresa
      tags: [OperacionesInternas]
      summary: Dar de alta una empresa y su primer administrador
      description: |
        **HU-001.** Procedimiento interno del equipo de VenceYa (RN-094, RN-095). Crea en una sola transacción la
        empresa y su primer usuario ADMINISTRADOR en estado INVITADO con enlace de 72 horas (RN-211); después envía
        la invitación por correo. Si el envío falla o no se confirma, la empresa y el usuario se conservan, no hay
        reintento automático y el resultado se informa en `envioInvitacion` (QA-08).
        Validaciones (RN-162): `razonSocial` con TRIM, espacios internos reducidos a uno y mayúsculas, de 1 a 250
        caracteres, al menos una letra; letras, dígitos, espacios y `. , & - ' ( ) /`. `ruc`: exactamente 11
        dígitos, tratado como texto (conserva ceros iniciales), único global por índice único.
        Correos con TRIM y minúsculas, máximo 250 caracteres. El correo del primer administrador es único global
        entre usuarios de cualquier estado; el error no revela a qué empresa pertenece.
        **Roles:** EQUIPO_VENCEYA (token de operaciones). Sin endpoint equivalente para roles de empresa.
      x-roles: [EQUIPO_VENCEYA]
      security:
        - tokenOperaciones: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudAltaEmpresa' }
            examples:
              alta:
                value:
                  razonSocial: "  comercial   andina s.a.c. "
                  ruc: "20123456789"
                  correoAdministrativo: "admin.andina@example.com"
                  correoPrimerAdministrador: " Ana.Torres@Example.com "
      responses:
        '201':
          description: Empresa y primer administrador creados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaAltaEmpresa' }
              examples:
                creada:
                  value:
                    empresa:
                      id: 7
                      razonSocial: COMERCIAL ANDINA S.A.C.
                      ruc: "20123456789"
                      correoAdministrativo: admin.andina@example.com
                      creadaEn: "2026-11-09T09:00:00-05:00"
                    primerAdministrador:
                      id: 12
                      correo: ana.torres@example.com
                      rol: ADMINISTRADOR
                      estado: INVITADO
                    envioInvitacion:
                      resultado: ENVIADO
                      enlaceVenceEn: "2026-11-12T09:00:00-05:00"
                correoRechazado:
                  summary: Proveedor de correo rechazó el envío; la empresa queda creada.
                  value:
                    empresa:
                      id: 7
                      razonSocial: COMERCIAL ANDINA S.A.C.
                      ruc: "20123456789"
                      correoAdministrativo: admin.andina@example.com
                      creadaEn: "2026-11-09T09:00:00-05:00"
                    primerAdministrador:
                      id: 12
                      correo: ana.torres@example.com
                      rol: ADMINISTRADOR
                      estado: INVITADO
                    envioInvitacion:
                      resultado: RECHAZADO
                      enlaceVenceEn: "2026-11-12T09:00:00-05:00"
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/PermisoDenegado' }
        '409':
          description: RUC ya registrado o correo del primer administrador ya registrado. No se crea nada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                rucDuplicado:
                  value:
                    codigo: RUC_YA_REGISTRADO
                    mensaje: Ya existe una empresa con ese RUC.
                    idSolicitud: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c40
                correoDuplicado:
                  value:
                    codigo: CORREO_USUARIO_YA_REGISTRADO
                    mensaje: El correo del primer administrador ya está registrado.
                    idSolicitud: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c41
        '422':
          description: Datos inválidos (RUC, razón social o correos).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                rucInvalido:
                  value:
                    codigo: VALIDACION_FALLIDA
                    mensaje: La solicitud tiene datos que no cumplen las reglas.
                    detalles:
                      - { campo: ruc, codigo: RUC_LONGITUD, mensaje: El RUC debe tener exactamente 11 dígitos. }
                    idSolicitud: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c42
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /interno/empresas/{empresaId}/reenvio-invitacion-administrador:
    post:
      operationId: reenviarInvitacionPrimerAdministrador
      tags: [OperacionesInternas]
      summary: Reenviar la invitación del primer administrador
      description: |
        **HU-001.** Solo procede si el primer administrador sigue INVITADO y la empresa no tiene ningún
        ADMINISTRADOR ACTIVO; ambas condiciones se comprueban al guardar (RN-095, RN-098, RN-160). Emite un enlace
        nuevo de 72 horas y revoca el anterior en la misma operación. Audita quién lo hizo, el destinatario y la
        fecha y hora, sin el enlace. No reactiva usuarios DESACTIVADOS. Se rechaza con `409 CONTRATO_TERMINADO`
        si la empresa tiene la terminación contractual efectiva (RN-152).
        **Roles:** EQUIPO_VENCEYA (token de operaciones).
      x-roles: [EQUIPO_VENCEYA]
      security:
        - tokenOperaciones: []
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
      responses:
        '200':
          description: Invitación reenviada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaReenvioInvitacion' }
              examples:
                reenviada:
                  value:
                    usuarioId: 12
                    envioInvitacion:
                      resultado: ENVIADO
                      enlaceVenceEn: "2026-11-12T11:30:00-05:00"
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/PermisoDenegado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El primer administrador ya está ACTIVO o DESACTIVADO, la empresa ya tiene un ADMINISTRADOR ACTIVO o su contrato terminó.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                yaActivo:
                  value:
                    codigo: ESTADO_NO_PERMITE_OPERACION
                    mensaje: El primer administrador no está en estado INVITADO.
                    idSolicitud: 8b2c3d4e-5f6a-4b7c-9d8e-0f1a2b3c4d50
                existeAdministradorActivo:
                  value:
                    codigo: EXISTE_ADMINISTRADOR_ACTIVO
                    mensaje: La empresa ya tiene un administrador activo; el reenvío corresponde a ese administrador.
                    idSolicitud: 8b2c3d4e-5f6a-4b7c-9d8e-0f1a2b3c4d51
                contratoTerminado:
                  value:
                    codigo: CONTRATO_TERMINADO
                    mensaje: El contrato de la empresa terminó; no se pueden emitir invitaciones.
                    idSolicitud: 8b2c3d4e-5f6a-4b7c-9d8e-0f1a2b3c4d52
        '500': { $ref: '#/components/responses/ErrorInterno' }

  # ───────────────────────────── Usuarios (HU-003) ─────────────────────────────
  /usuarios:
    get:
      operationId: listarUsuarios
      tags: [Usuarios]
      summary: Listar los usuarios de la empresa
      description: |
        **HU-003, HU-009.** Lista paginada de usuarios de la empresa de la sesión, ordenada por correo. Se usa
        también para elegir usuarios de las listas de copias (filtros `rol` y `estado`).
        **Roles:** ADMINISTRADOR.
      x-roles: [ADMINISTRADOR]
      parameters:
        - name: estado
          in: query
          schema: { $ref: '#/components/schemas/EstadoUsuario' }
        - name: rol
          in: query
          schema: { $ref: '#/components/schemas/Rol' }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
      responses:
        '200':
          description: Página de usuarios.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaUsuarios' }
              examples:
                pagina:
                  value:
                    elementos:
                      - id: 12
                        correo: ana.torres@example.com
                        rol: ADMINISTRADOR
                        estado: ACTIVO
                        tieneContrasena: true
                        creadoEn: "2026-11-09T09:00:00-05:00"
                        actualizadoEn: "2026-11-09T09:40:00-05:00"
                        version: 2
                      - id: 15
                        correo: luis.ramos@example.com
                        rol: OPERADOR
                        estado: ACTIVO
                        tieneContrasena: true
                        creadoEn: "2026-11-09T10:00:00-05:00"
                        actualizadoEn: "2026-11-09T10:20:00-05:00"
                        version: 2
                    paginacion: { pagina: 1, tamanoPagina: 20, totalElementos: 2, totalPaginas: 1 }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/PermisoDenegado' }
    post:
      operationId: invitarUsuario
      tags: [Usuarios]
      summary: Invitar un usuario con un rol
      description: |
        **HU-003.** Crea el usuario en la empresa de la sesión, en estado INVITADO, con exactamente un rol, y
        envía un enlace de 72 horas. El administrador no conoce ni define la contraseña. El correo se normaliza y
        es único global entre usuarios de cualquier estado (RN-097). Si el correo falla o no se confirma, el
        usuario queda creado y `envioInvitacion` lo informa; no hay reintento automático (QA-08).
        **Roles:** ADMINISTRADOR.
      x-roles: [ADMINISTRADOR]
      parameters:
        - $ref: '#/components/parameters/TokenCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudInvitacion' }
            examples:
              operador:
                value: { correo: " Luis.Ramos@Example.com ", rol: OPERADOR }
      responses:
        '201':
          description: Usuario invitado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaInvitacion' }
              examples:
                enviada:
                  value:
                    usuario:
                      id: 15
                      correo: luis.ramos@example.com
                      rol: OPERADOR
                      estado: INVITADO
                      tieneContrasena: false
                      creadoEn: "2026-11-09T10:00:00-05:00"
                      actualizadoEn: "2026-11-09T10:00:00-05:00"
                      version: 1
                    envioInvitacion: { resultado: ENVIADO, enlaceVenceEn: "2026-11-12T10:00:00-05:00" }
                enProceso:
                  summary: El proveedor de correo agotó el tiempo de espera.
                  value:
                    usuario:
                      id: 15
                      correo: luis.ramos@example.com
                      rol: OPERADOR
                      estado: INVITADO
                      tieneContrasena: false
                      creadoEn: "2026-11-09T10:00:00-05:00"
                      actualizadoEn: "2026-11-09T10:00:00-05:00"
                      version: 1
                    envioInvitacion: { resultado: SIN_CONFIRMAR, enlaceVenceEn: "2026-11-12T10:00:00-05:00" }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/PermisoDenegado' }
        '409':
          description: El correo ya pertenece a un usuario (de esta u otra empresa, en cualquier estado).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                correoDuplicado:
                  value:
                    codigo: CORREO_USUARIO_YA_REGISTRADO
                    mensaje: El correo ya está registrado.
                    idSolicitud: 9c3d4e5f-6a7b-4c8d-0e9f-1a2b3c4d5e60
        '422':
          description: Correo sin formato válido o rol inexistente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                rolInvalido:
                  value:
                    codigo: VALIDACION_FALLIDA
                    mensaje: La solicitud tiene datos que no cumplen las reglas.
                    detalles:
                      - { campo: rol, codigo: VALOR_NO_PERMITIDO, mensaje: "El rol debe ser ADMINISTRADOR, SUPERVISOR u OPERADOR." }
                    idSolicitud: 9c3d4e5f-6a7b-4c8d-0e9f-1a2b3c4d5e61
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /usuarios/{usuarioId}:
    get:
      operationId: obtenerUsuario
      tags: [Usuarios]
      summary: Obtener un usuario de la empresa
      description: |
        **HU-003.** Devuelve el usuario si pertenece a la empresa de la sesión; si no, `404`.
        **Roles:** ADMINISTRADOR.
      x-roles: [ADMINISTRADOR]
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '200':
          description: Usuario.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
              examples:
                ana:
                  $ref: '#/components/examples/UsuarioAna'
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/PermisoDenegado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /usuarios/{usuarioId}/rol:
    put:
      operationId: cambiarRolUsuario
      tags: [Usuarios]
      summary: Cambiar el rol de un usuario
      description: |
        **HU-003.** Reemplaza el rol. Un cambio efectivo cierra todas las sesiones del afectado y se audita
        (administrador, afectado, empresa, rol anterior, rol nuevo, fecha y hora) en la misma transacción (RN-161).
        Guardar el mismo rol no cierra sesiones ni se audita (`200` sin cambios). Se rechaza si deja a la empresa
        sin ADMINISTRADOR ACTIVO (RN-100). `version` aplica control de concurrencia optimista.
        **Roles:** ADMINISTRADOR.
      x-roles: [ADMINISTRADOR]
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/TokenCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudCambioRol' }
            examples:
              aSupervisor:
                value: { rol: SUPERVISOR, version: 2 }
      responses:
        '200':
          description: Rol guardado (o sin cambios si era el mismo).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaCambioRol' }
              examples:
                cambiado:
                  value:
                    usuario:
                      id: 15
                      correo: luis.ramos@example.com
                      rol: SUPERVISOR
                      estado: ACTIVO
                      tieneContrasena: true
                      creadoEn: "2026-11-09T10:00:00-05:00"
                      actualizadoEn: "2026-11-09T15:00:00-05:00"
                      version: 3
                    cambioEfectivo: true
                    sesionesCerradas: 2
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/PermisoDenegado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Último administrador activo o datos desactualizados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                ultimoAdministrador:
                  value:
                    codigo: ULTIMO_ADMINISTRADOR_ACTIVO
                    mensaje: La empresa debe conservar al menos un administrador activo.
                    idSolicitud: 0d4e5f6a-7b8c-4d9e-1f0a-2b3c4d5e6f70
                desactualizado:
                  $ref: '#/components/examples/ErrorDatosDesactualizados'
        '422': { $ref: '#/components/responses/ValidacionFallida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /usuarios/{usuarioId}/desactivacion:
    post:
      operationId: desactivarUsuario
      tags: [Usuarios]
      summary: Desactivar un usuario
      description: |
        **HU-003.** El usuario pasa a DESACTIVADO, pierde todas sus sesiones y se revocan sus enlaces vigentes en
        la misma operación. Conserva su identidad en los registros históricos. No existe eliminación de usuarios.
        Se rechaza si es el último ADMINISTRADOR ACTIVO (RN-100). Deja de recibir copias de avisos (RN-135).
        **Roles:** ADMINISTRADOR.
      x-roles: [ADMINISTRADOR]
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/TokenCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudConVersion' }
            examples:
              desactivar:
                value: { version: 3 }
      responses:
        '200':
          description: Usuario desactivado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
              examples:
                desactivado:
                  value:
                    id: 15
                    correo: luis.ramos@example.com
                    rol: OPERADOR
                    estado: DESACTIVADO
                    tieneContrasena: true
                    creadoEn: "2026-11-09T10:00:00-05:00"
                    actualizadoEn: "2026-11-09T16:00:00-05:00"
                    version: 4
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/PermisoDenegado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Ya desactivado, último administrador activo o datos desactualizados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                ultimoAdministrador:
                  value:
                    codigo: ULTIMO_ADMINISTRADOR_ACTIVO
                    mensaje: La empresa debe conservar al menos un administrador activo.
                    idSolicitud: 1e5f6a7b-8c9d-4e0f-2a1b-3c4d5e6f7a80
                yaDesactivado:
                  value:
                    codigo: ESTADO_NO_PERMITE_OPERACION
                    mensaje: El usuario ya está desactivado.
                    idSolicitud: 1e5f6a7b-8c9d-4e0f-2a1b-3c4d5e6f7a81
        '422': { $ref: '#/components/responses/ValidacionFallida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /usuarios/{usuarioId}/reactivacion:
    post:
      operationId: reactivarUsuario
      tags: [Usuarios]
      summary: Reactivar un usuario desactivado
      description: |
        **HU-003.** Si el usuario ya había definido contraseña, vuelve a ACTIVO con ella, sin correo. Si nunca la
        definió, pasa a INVITADO con un enlace nuevo de 72 horas (RN-098, RN-099); `envioInvitacion` informa el
        resultado del correo.
        **Roles:** ADMINISTRADOR.
      x-roles: [ADMINISTRADOR]
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/TokenCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudConVersion' }
            examples:
              reactivar:
                value: { version: 4 }
      responses:
        '200':
          description: Usuario reactivado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaReactivacion' }
              examples:
                conContrasena:
                  value:
                    usuario:
                      id: 15
                      correo: luis.ramos@example.com
                      rol: OPERADOR
                      estado: ACTIVO
                      tieneContrasena: true
                      creadoEn: "2026-11-09T10:00:00-05:00"
                      actualizadoEn: "2026-11-09T17:00:00-05:00"
                      version: 5
                    envioInvitacion: null
                sinContrasena:
                  value:
                    usuario:
                      id: 16
                      correo: marta.quispe@example.com
                      rol: OPERADOR
                      estado: INVITADO
                      tieneContrasena: false
                      creadoEn: "2026-11-05T10:00:00-05:00"
                      actualizadoEn: "2026-11-09T17:00:00-05:00"
                      version: 3
                    envioInvitacion: { resultado: ENVIADO, enlaceVenceEn: "2026-11-12T17:00:00-05:00" }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/PermisoDenegado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El usuario no está DESACTIVADO o datos desactualizados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                noDesactivado:
                  value:
                    codigo: ESTADO_NO_PERMITE_OPERACION
                    mensaje: Solo se puede reactivar un usuario desactivado.
                    idSolicitud: 2f6a7b8c-9d0e-4f1a-3b2c-4d5e6f7a8b90
        '422': { $ref: '#/components/responses/ValidacionFallida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /usuarios/{usuarioId}/reenvio-invitacion:
    post:
      operationId: reenviarInvitacion
      tags: [Usuarios]
      summary: Reenviar la invitación de un usuario INVITADO
      description: |
        **HU-003.** Emite un enlace nuevo de 72 horas y revoca el anterior en la misma operación, haya vencido o
        no. Solo para usuarios INVITADOS.
        **Roles:** ADMINISTRADOR.
      x-roles: [ADMINISTRADOR]
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/TokenCsrf'
      responses:
        '200':
          description: Invitación reenviada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaReenvioInvitacion' }
              examples:
                reenviada:
                  value:
                    usuarioId: 15
                    envioInvitacion: { resultado: ENVIADO, enlaceVenceEn: "2026-11-12T18:00:00-05:00" }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/PermisoDenegado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El usuario no está INVITADO.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                noInvitado:
                  value:
                    codigo: ESTADO_NO_PERMITE_OPERACION
                    mensaje: Solo se puede reenviar la invitación a un usuario invitado.
                    idSolicitud: 3a7b8c9d-0e1f-4a2b-4c3d-5e6f7a8b9c00
        '500': { $ref: '#/components/responses/ErrorInterno' }

  # ───────────────────────────── Mi cuenta (HU-008) ─────────────────────────────
  /mi-cuenta/preferencias:
    get:
      operationId: obtenerMisPreferencias
      tags: [MiCuenta]
      summary: Obtener mis preferencias personales
      description: |
        **HU-008.** Preferencias del usuario de la sesión: moneda del panel y ventana de proyección. Ningún
        usuario puede ver las de otro (RN-170). Incluye los valores efectivos que resultan de aplicar la moneda
        por defecto de la empresa y la ventana de 7 días.
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR (solo las propias).
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      responses:
        '200':
          description: Preferencias.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferencias' }
              examples:
                sinPreferencias:
                  value: { monedaPreferida: null, ventanaProyeccionDias: null, monedaEfectiva: PEN, ventanaEfectivaDias: 7 }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    put:
      operationId: actualizarMisPreferencias
      tags: [MiCuenta]
      summary: Actualizar mis preferencias personales
      description: |
        **HU-008.** Guarda la moneda preferida (`PEN`, `USD` o `null` para usar la de la empresa) y la ventana
        de proyección (7, 10 o 15; `null` para 7 por defecto) (RN-169, RN-180). Solo afecta al usuario de la
        sesión; no hay ruta para modificar las de otro usuario (RN-171).
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR (solo las propias).
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - $ref: '#/components/parameters/TokenCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudPreferencias' }
            examples:
              dolaresQuinceDias:
                value: { monedaPreferida: USD, ventanaProyeccionDias: 15 }
      responses:
        '200':
          description: Preferencias guardadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferencias' }
              examples:
                guardadas:
                  value: { monedaPreferida: USD, ventanaProyeccionDias: 15, monedaEfectiva: USD, ventanaEfectivaDias: 15 }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '422':
          description: Ventana fuera de 7, 10 o 15, o moneda no admitida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                ventanaInvalida:
                  value:
                    codigo: VALIDACION_FALLIDA
                    mensaje: La solicitud tiene datos que no cumplen las reglas.
                    detalles:
                      - { campo: ventanaProyeccionDias, codigo: VALOR_NO_PERMITIDO, mensaje: "La ventana debe ser de 7, 10 o 15 días." }
                    idSolicitud: 4b8c9d0e-1f2a-4b3c-5d4e-6f7a8b9c0d10

  # ───────────────────────────── Configuración de empresa (HU-008, HU-009) ─────────────────────────────
  /empresa/configuracion:
    get:
      operationId: obtenerConfiguracionEmpresa
      tags: [ConfiguracionEmpresa]
      summary: Obtener la configuración de la empresa
      description: |
        **HU-008, HU-009.** Razón social, RUC, correo administrativo y moneda por defecto de la empresa de la
        sesión.
        **Roles:** ADMINISTRADOR.
      x-roles: [ADMINISTRADOR]
      responses:
        '200':
          description: Configuración.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfiguracionEmpresa' }
              examples:
                actual:
                  value:
                    razonSocial: COMERCIAL ANDINA S.A.C.
                    ruc: "20123456789"
                    correoAdministrativo: admin.andina@example.com
                    monedaPorDefecto: PEN
                    version: 1
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/PermisoDenegado' }
    patch:
      operationId: actualizarConfiguracionEmpresa
      tags: [ConfiguracionEmpresa]
      summary: Cambiar el correo administrativo o la moneda por defecto
      description: |
        **HU-008, HU-009.** Cambia `correoAdministrativo` (TRIM, minúsculas, formato válido, máximo 250) y/o
        `monedaPorDefecto`. Audita valor anterior, nuevo, usuario y fecha y hora, sin escribirlos en logs
        (RN-014). Los avisos ya enviados no cambian; los nuevos usan el correo vigente
        como copia y dirección de respuesta (RN-104).
        **Roles:** ADMINISTRADOR.
      x-roles: [ADMINISTRADOR]
      parameters:
        - $ref: '#/components/parameters/TokenCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudConfiguracionEmpresa' }
            examples:
              cambioCorreo:
                value: { correoAdministrativo: "cobranzas.andina@example.com", version: 1 }
              cambioMoneda:
                value: { monedaPorDefecto: USD, version: 2 }
      responses:
        '200':
          description: Configuración guardada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfiguracionEmpresa' }
              examples:
                guardada:
                  value:
                    razonSocial: COMERCIAL ANDINA S.A.C.
                    ruc: "20123456789"
                    correoAdministrativo: cobranzas.andina@example.com
                    monedaPorDefecto: PEN
                    version: 2
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/PermisoDenegado' }
        '409':
          description: Datos desactualizados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                desactualizado:
                  $ref: '#/components/examples/ErrorDatosDesactualizados'
        '422':
          description: Correo vacío o sin formato válido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                correoInvalido:
                  value:
                    codigo: VALIDACION_FALLIDA
                    mensaje: La solicitud tiene datos que no cumplen las reglas.
                    detalles:
                      - { campo: correoAdministrativo, codigo: FORMATO_CORREO, mensaje: El correo administrativo no tiene formato válido. }
                    idSolicitud: 5c9d0e1f-2a3b-4c4d-6e5f-7a8b9c0d1e20
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /empresa/listas-copias:
    get:
      operationId: obtenerListasCopias
      tags: [ConfiguracionEmpresa]
      summary: Obtener las listas de copias de avisos
      description: |
        **HU-009.** Listas de usuarios en copia para avisos por cobrar y por pagar. Un miembro que fue
        desactivado o pasó a OPERADOR aparece con `recibeCopias: false` hasta que se quite o recupere un rol y
        estado válidos (RN-135).
        **Roles:** ADMINISTRADOR.
      x-roles: [ADMINISTRADOR]
      responses:
        '200':
          description: Listas de copias.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListasCopias' }
              examples:
                listas:
                  value:
                    porCobrar:
                      - usuarioId: 18
                        correo: jefe.cobranzas@example.com
                        rol: SUPERVISOR
                        estado: ACTIVO
                        recibeCopias: true
                        agregadoEn: "2026-11-09T11:00:00-05:00"
                    porPagar: []
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/PermisoDenegado' }

  /empresa/listas-copias/{sentido}/usuarios:
    post:
      operationId: agregarUsuarioListaCopias
      tags: [ConfiguracionEmpresa]
      summary: Agregar un usuario a una lista de copias
      description: |
        **HU-009.** Agrega un SUPERVISOR o ADMINISTRADOR ACTIVO de la empresa a la lista indicada. No se admiten
        direcciones escritas a mano, OPERADORES ni usuarios INVITADOS o DESACTIVADOS. Un usuario de otra empresa
        responde igual que uno inexistente (`404`). Audita usuario agregado, lista, administrador y fecha y hora.
        **Roles:** ADMINISTRADOR.
      x-roles: [ADMINISTRADOR]
      parameters:
        - $ref: '#/components/parameters/SentidoLista'
        - $ref: '#/components/parameters/TokenCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudAgregarCopia' }
            examples:
              supervisor:
                value: { usuarioId: 18 }
      responses:
        '201':
          description: Usuario agregado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListasCopias' }
              examples:
                agregado:
                  value:
                    porCobrar:
                      - usuarioId: 18
                        correo: jefe.cobranzas@example.com
                        rol: SUPERVISOR
                        estado: ACTIVO
                        recibeCopias: true
