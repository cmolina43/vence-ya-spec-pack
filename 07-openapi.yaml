  /avisos/intentos:
    get:
      operationId: listarIntentosAviso
      tags: [Avisos]
      summary: Consultar la bandeja interna de avisos
      description: |
        **HU-010.** Lista paginada de intentos de aviso de la empresa, del más reciente al más antiguo, con su
        resultado. Filtros por estado, cuota y contacto.
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR.
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - name: estado
          in: query
          schema: { $ref: '#/components/schemas/EstadoIntento' }
        - name: cuotaId
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: contactoId
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
      responses:
        '200':
          description: Página de intentos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaIntentosAviso' }
              examples:
                pagina:
                  value:
                    elementos:
                      - id: 3001
                        estado: ENVIADO
                        motivoNoEnvio: null
                        tipoAviso: COBRAR_VENCIDA
                        contacto: { id: 42, nombre: DISTRIBUIDORA LIMA, estado: ACTIVO }
                        cuotas:
                          - { cuotaId: 9001, numeroDocumento: F001-00045, numeroCuota: 1, fechaEfectivaVencimiento: "2026-11-03", moneda: PEN, saldoAlEnvio: "600.00" }
                        comentario: FAVOR CONFIRMAR FECHA DE PAGO
                        destinatarios:
                          para: [ventas.distlima@example.com]
                          copias: [admin.andina@example.com, jefe.cobranzas@example.com]
                          responderA: admin.andina@example.com
                        creadoPor: { id: 15, correo: luis.ramos@example.com }
                        creadoEn: "2026-11-07T09:05:00-05:00"
                        resueltoEn: "2026-11-07T09:05:01-05:00"
                    paginacion: { pagina: 1, tamanoPagina: 20, totalElementos: 1, totalPaginas: 1 }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /avisos/intentos/{intentoId}:
    get:
      operationId: obtenerIntentoAviso
      tags: [Avisos]
      summary: Obtener un intento de aviso
      description: |
        **HU-010.** Detalle de un intento de la bandeja interna, con su estado funcional y motivo de fallo.
        Tras vencer el plazo sin éxito registrado se devuelve NO_ENVIADO; esta lectura no llama al proveedor
        ni persiste el cierre. La SPA puede refrescar con `X-Peticion-Automatica: true` sin renovar la sesión.
        **Roles:** ADMINISTRADOR, SUPERVISOR, OPERADOR.
      x-roles: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
      parameters:
        - $ref: '#/components/parameters/IntentoId'
        - $ref: '#/components/parameters/PeticionAutomatica'
      responses:
        '200':
          description: Intento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntentoAviso' }
              examples:
                aceptado:
                  $ref: '#/components/examples/IntentoAceptado'
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

components:
  securitySchemes:
    sesionCookie:
      type: apiKey
      in: cookie
      name: venceya_sesion
      description: |
        Sesión opaca en servidor (RN-149). Las operaciones distintas de GET exigen además la cabecera `X-Token-CSRF`.
    tokenOperaciones:
      type: http
      scheme: bearer
      description: |
        Token personal del equipo de VenceYa para procedimientos internos. Solo se acepta en la API interna,
        publicada en la red privada. Nunca lo emite ni lo acepta la API pública.

  parameters:
    TokenCsrf:
      name: X-Token-CSRF
      in: header
      required: true
      description: Token CSRF entregado al iniciar sesión (`SesionActual.tokenCsrf`).
      schema: { type: string, minLength: 32, maxLength: 128 }
      example: csrf_4fK9pL2qW8zX5mN7vB1cR3tY6uI0oP2a
    PeticionAutomatica:
      name: X-Peticion-Automatica
      in: header
      required: false
      description: '`true` en sondeos o refrescos automáticos; no renueva la inactividad de la sesión (RN-149).'
      schema: { type: boolean, default: false }
    ClaveIdempotencia:
      name: Clave-Idempotencia
      in: header
      required: true
      description: |
        Clave estable de la operación (UUID v4 generado por la SPA al abrir el formulario y conservado en los
        reintentos). Única por empresa; vinculada a cuota, fecha e importe (RN-156).
      schema: { type: string, format: uuid }
      example: 6f1c2a9e-3b7d-4e5f-8a0b-1c2d3e4f5a6b
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    TamanoPagina:
      name: tamanoPagina
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    EmpresaId:
      name: empresaId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      example: 7
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      example: 15
    ContactoId:
      name: contactoId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      example: 42
    ComprobanteId:
      name: comprobanteId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      example: 501
    CuotaId:
      name: cuotaId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      example: 9001
    PagoId:
      name: pagoId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      example: 1001
    IntentoId:
      name: intentoId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      example: 3001
    SentidoLista:
      name: sentido
      in: path
      required: true
      schema: { type: string, enum: [por-cobrar, por-pagar] }
      example: por-cobrar

  responses:
    SolicitudInvalida:
      description: Cuerpo JSON mal formado o parámetros de ruta o de consulta inválidos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            jsonInvalido:
              value:
                codigo: SOLICITUD_INVALIDA
                mensaje: La solicitud no tiene el formato esperado.
                idSolicitud: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
    NoAutenticado:
      description: |
        Sin sesión vigente (inexistente, vencida por inactividad o por plazo absoluto, o cerrada). Si la empresa
        alcanzó su terminación contractual efectiva, la sesión se cierra en esa misma petición y el código es
        `CONTRATO_TERMINADO` (RN-149, RN-152).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            sesionVencida:
              value:
                codigo: SESION_NO_VIGENTE
                mensaje: Tu sesión terminó. Inicia sesión nuevamente.
                idSolicitud: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
            contratoTerminado:
              value:
                codigo: CONTRATO_TERMINADO
                mensaje: El contrato de tu empresa con VenceYa terminó. Ya no es posible acceder.
                idSolicitud: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6f
    ContratoTerminado:
      description: |
        La empresa alcanzó su terminación contractual efectiva (`terminacion_efectiva_en` menor o igual que el
        instante actual). Sin efectos: no crea sesión ni consume enlaces (RN-101, RN-152).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            contratoTerminado:
              value:
                codigo: CONTRATO_TERMINADO
                mensaje: El contrato de tu empresa con VenceYa terminó. Ya no es posible acceder.
                idSolicitud: d4e5f6a7-b8c9-4d0e-8f1a-2b3c4d5e6f70
    PermisoDenegado:
      description: El rol del usuario no tiene permiso para la operación (RN-060). Sin efectos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            sinPermiso:
              value:
                codigo: PERMISO_DENEGADO
                mensaje: No tienes permiso para realizar esta operación.
                idSolicitud: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
    CsrfInvalido:
      description: Falta la cabecera `X-Token-CSRF` o no coincide con la de la sesión.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            csrf:
              value:
                codigo: TOKEN_CSRF_INVALIDO
                mensaje: La solicitud no pudo verificarse. Recarga la página.
                idSolicitud: d4e5f6a7-b8c9-4d0e-1f2a-3b4c5d6e7f80
    NoEncontrado:
      description: El recurso no existe o pertenece a otra empresa; ambos casos responden igual (RN-008).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            noEncontrado:
              value:
                codigo: RECURSO_NO_ENCONTRADO
                mensaje: El recurso solicitado no existe.
                idSolicitud: e5f6a7b8-c9d0-4e1f-2a3b-4c5d6e7f8091
    ValidacionFallida:
      description: El cuerpo incumple reglas de contenido o de negocio. `detalles` indica cada campo sin repetir su valor.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            validacion:
              value:
                codigo: VALIDACION_FALLIDA
                mensaje: La solicitud tiene datos que no cumplen las reglas.
                detalles:
                  - { campo: correo, codigo: FORMATO_CORREO, mensaje: El correo no tiene formato válido. }
                idSolicitud: f6a7b8c9-d0e1-4f2a-3b4c-5d6e7f8091a2
    ErrorInterno:
      description: Falla técnica. La operación no dejó efectos (RN-160) y puede repetirse.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            interno:
              value:
                codigo: ERROR_INTERNO
                mensaje: No se pudo completar la operación. No se guardó ningún cambio.
                idSolicitud: 0a1b2c3d-4e5f-4061-8293-a4b5c6d7e8f9

