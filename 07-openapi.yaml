        vigentes (sin pagos o con todos anulados). El comprobante queda ANULADO, sus cuotas ANULADAS y de solo
        lectura; dejan de sumar en cartera, indicadores y avisos. Total e irreversible. `motivo`: TRIM (incluye
        tabulaciones, saltos de línea y espacios no separables), mayúsculas, espacios internos conservados, 1 a
        500 caracteres (RN-162, RN-030). La comprobación de pagos y la anulación son atómicas frente a un pago
        concurrente (RN-062, RN-160).
        **Roles:** SUPERVISOR, ADMINISTRADOR.
