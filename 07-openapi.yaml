        codigo: INTENTO_EN_PROCESO
        mensaje: Hay un envío en proceso para estas cuotas. Intenta cuando termine.
        detalles:
          - { campo: cuotaIds, codigo: INTENTO_EXISTENTE, mensaje: "Intento 3003 en proceso con plazo vigente." }
        idSolicitud: 55667788-99aa-4bbc-ccdd-eeff00112234
    ErrorSinCuotasAptas:
      value:
        codigo: SIN_CUOTAS_APTAS
        mensaje: Ninguna de las cuotas seleccionadas es apta para aviso.
        detalles:
          - { campo: cuotaIds, codigo: CUOTA_CANCELADA, mensaje: "La cuota 9002 está cancelada." }
        idSolicitud: 66778899-aabb-4ccd-ddee-ff0011223345

  schemas:
    # ── Comunes ──
    Error:
      type: object
      description: Formato único de error. Nunca contiene datos personales ni valores ingresados (PRINCIPIO-005).
      required: [codigo, mensaje, idSolicitud]
      properties:
        codigo:
          type: string
          description: Código estable en MAYÚSCULAS_CON_GUION_BAJO (catálogo en `07-architecture.md`).
          examples: [VALIDACION_FALLIDA]
        mensaje:
          type: string
          description: Mensaje en español para el usuario.
        detalles:
          type: array
          items: { $ref: '#/components/schemas/DetalleError' }
        idSolicitud:
          type: string
          format: uuid
          description: Identificador de correlación también registrado en los logs.
    DetalleError:
      type: object
      required: [campo, codigo, mensaje]
      properties:
        campo: { type: string, description: 'Ruta del campo (por ejemplo `cuotas[1].importe`).' }
        codigo: { type: string }
        mensaje: { type: string }
    ErrorAviso:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            vistaPreviaVigente:
              $ref: '#/components/schemas/VistaPreviaAviso'
    Paginacion:
      type: object
      required: [pagina, tamanoPagina, totalElementos, totalPaginas]
      properties:
        pagina: { type: integer, minimum: 1 }
        tamanoPagina: { type: integer, minimum: 1, maximum: 100 }
        totalElementos: { type: integer, minimum: 0 }
        totalPaginas: { type: integer, minimum: 0 }
    Importe:
      type: string
      description: Importe canónico de entrada, mayor que 0, hasta 12 dígitos enteros y 2 decimales, sin separador de miles.
      pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$'
      examples: ["1000.50"]
    ImporteRespuesta:
      type: string
      description: Importe con exactamente 2 decimales.
      pattern: '^(0|[1-9][0-9]{0,11})\.[0-9]{2}$'
      examples: ["1000.50"]
    Moneda:
      type: string
      enum: [PEN, USD]
      description: '`PEN` = S/ (soles), `USD` = US$ (dólares).'
    Rol:
      type: string
      enum: [ADMINISTRADOR, SUPERVISOR, OPERADOR]
    EstadoUsuario:
      type: string
      enum: [INVITADO, ACTIVO, DESACTIVADO]
    EstadoContacto:
      type: string
      enum: [ACTIVO, DESACTIVADO]
    Sentido:
      type: string
      enum: [POR_COBRAR, POR_PAGAR]
    Modalidad:
      type: string
      enum: [PAGO_UNICO, CUOTAS]
    EstadoComprobante:
      type: string
      enum: [VIGENTE, ANULADO]
    EstadoCuota:
      type: string
      enum: [PENDIENTE, VENCIDA, CANCELADA, ANULADA]
    EstadoPago:
      type: string
      enum: [VIGENTE, ANULADO]
    EstadoPromesa:
      type: string
      enum: [ACTIVA, REEMPLAZADA, CUMPLIDA, INCUMPLIDA]
    TipoAviso:
      type: string
      enum: [COBRAR_POR_VENCER, COBRAR_VENCIDA, PAGAR_POR_VENCER, PAGAR_VENCIDA]
      description: Maqueta fija según sentido y estado de la cuota (RN-114).
    EstadoIntento:
      type: string
      enum: [EN_PROCESO, ENVIADO, NO_ENVIADO]
      description: EN_PROCESO solo durante el plazo vigente del servidor; tras vencer sin éxito registrado se devuelve NO_ENVIADO, aunque el cierre persistente se recupere en el siguiente envío (RN-158).
    ResultadoEnvioCorreo:
      type: string
      enum: [ENVIADO, RECHAZADO, SIN_CONFIRMAR]
    Correo:
      type: string
      description: Se normaliza con TRIM y minúsculas; formato válido con dominio con punto; 1 a 250 caracteres.
      maxLength: 320
      examples: [ana.torres@example.com]
    ReferenciaUsuario:
      type: object
      required: [id, correo]
      properties:
        id: { type: integer, format: int64 }
        correo: { type: string }
    ContactoResumen:
      type: object
      required: [id, nombre, estado]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        estado: { $ref: '#/components/schemas/EstadoContacto' }
    SolicitudConVersion:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1, description: Versión vista por el usuario (concurrencia optimista). }
    EnvioCorreo:
      type: object
      required: [resultado, enlaceVenceEn]
      properties:
        resultado: { $ref: '#/components/schemas/ResultadoEnvioCorreo' }
        enlaceVenceEn: { type: string, format: date-time }

    # ── Autenticación ──
    SolicitudInicioSesion:
      type: object
      required: [correo, contrasena]
      additionalProperties: false
      properties:
        correo: { $ref: '#/components/schemas/Correo' }
        contrasena: { type: string, maxLength: 1024, description: Se envía tal cual; no se recorta. }
    SesionActual:
      type: object
      required: [usuario, empresa, tokenCsrf, iniciadaEn, venceAbsolutoEn, minutosInactividad]
      properties:
        usuario:
          type: object
          required: [id, correo, rol]
          properties:
            id: { type: integer, format: int64 }
            correo: { type: string }
            rol: { $ref: '#/components/schemas/Rol' }
        empresa:
          type: object
          required: [id, razonSocial]
          properties:
            id: { type: integer, format: int64 }
            razonSocial: { type: string }
        tokenCsrf: { type: string }
        iniciadaEn: { type: string, format: date-time }
        venceAbsolutoEn: { type: string, format: date-time, description: Inicio + 12 horas; no se renueva. }
        minutosInactividad: { type: integer, const: 30 }
    SolicitudActivacion:
      type: object
      required: [token, contrasena]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 16, maxLength: 256 }
        contrasena: { type: string, description: 8 a 128 caracteres; cualquier carácter; no vacía ni solo espacios; sin recorte. }
    SolicitudRecuperacion:
      type: object
      required: [correo]
      additionalProperties: false
      properties:
        correo: { $ref: '#/components/schemas/Correo' }
    RespuestaRecuperacion:
      type: object
      required: [mensaje]
      properties:
        mensaje: { type: string }
    SolicitudRestablecimiento:
      type: object
      required: [token, contrasenaNueva]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 16, maxLength: 256 }
        contrasenaNueva: { type: string, description: Mismas reglas que en la activación. }

    # ── Operaciones internas ──
    SolicitudAltaEmpresa:
      type: object
      required: [razonSocial, ruc, correoAdministrativo, correoPrimerAdministrador]
      additionalProperties: false
      properties:
        razonSocial: { type: string, description: 'RN-162: TRIM, un espacio interno, MAYÚSCULAS, 1 a 250, al menos una letra.' }
        ruc: { type: string, description: Exactamente 11 dígitos tras TRIM; texto. }
        correoAdministrativo: { $ref: '#/components/schemas/Correo' }
        correoPrimerAdministrador: { $ref: '#/components/schemas/Correo' }
    RespuestaAltaEmpresa:
      type: object
      required: [empresa, primerAdministrador, envioInvitacion]
      properties:
        empresa:
          type: object
          required: [id, razonSocial, ruc, correoAdministrativo, creadaEn]
          properties:
            id: { type: integer, format: int64 }
            razonSocial: { type: string }
            ruc: { type: string }
            correoAdministrativo: { type: string }
            creadaEn: { type: string, format: date-time }
        primerAdministrador:
          type: object
          required: [id, correo, rol, estado]
          properties:
            id: { type: integer, format: int64 }
            correo: { type: string }
            rol: { $ref: '#/components/schemas/Rol' }
            estado: { $ref: '#/components/schemas/EstadoUsuario' }
        envioInvitacion: { $ref: '#/components/schemas/EnvioCorreo' }
    RespuestaReenvioInvitacion:
      type: object
      required: [usuarioId, envioInvitacion]
      properties:
        usuarioId: { type: integer, format: int64 }
        envioInvitacion: { $ref: '#/components/schemas/EnvioCorreo' }

    # ── Usuarios ──
    Usuario:
      type: object
      required: [id, correo, rol, estado, tieneContrasena, creadoEn, actualizadoEn, version]
      properties:
        id: { type: integer, format: int64 }
        correo: { type: string }
        rol: { $ref: '#/components/schemas/Rol' }
        estado: { $ref: '#/components/schemas/EstadoUsuario' }
        tieneContrasena: { type: boolean, description: Indica si alguna vez definió contraseña (determina la reactivación). }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
        version: { type: integer }
    PaginaUsuarios:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos: { type: array, items: { $ref: '#/components/schemas/Usuario' } }
        paginacion: { $ref: '#/components/schemas/Paginacion' }
    SolicitudInvitacion:
      type: object
      required: [correo, rol]
      additionalProperties: false
      properties:
        correo: { $ref: '#/components/schemas/Correo' }
        rol: { $ref: '#/components/schemas/Rol' }
    RespuestaInvitacion:
      type: object
      required: [usuario, envioInvitacion]
      properties:
        usuario: { $ref: '#/components/schemas/Usuario' }
        envioInvitacion: { $ref: '#/components/schemas/EnvioCorreo' }
    SolicitudCambioRol:
      type: object
      required: [rol, version]
      additionalProperties: false
      properties:
        rol: { $ref: '#/components/schemas/Rol' }
        version: { type: integer, minimum: 1 }
    RespuestaCambioRol:
      type: object
      required: [usuario, cambioEfectivo, sesionesCerradas]
      properties:
        usuario: { $ref: '#/components/schemas/Usuario' }
        cambioEfectivo: { type: boolean }
        sesionesCerradas: { type: integer, minimum: 0 }
    RespuestaReactivacion:
      type: object
      required: [usuario, envioInvitacion]
      properties:
        usuario: { $ref: '#/components/schemas/Usuario' }
        envioInvitacion:
          oneOf:
            - $ref: '#/components/schemas/EnvioCorreo'
            - type: 'null'

    # ── Mi cuenta y empresa ──
    SolicitudPreferencias:
      type: object
      required: [monedaPreferida, ventanaProyeccionDias]
      additionalProperties: false
      properties:
        monedaPreferida:
          type: [string, 'null']
          enum: [PEN, USD, null]
        ventanaProyeccionDias:
          type: [integer, 'null']
          enum: [7, 10, 15, null]
    Preferencias:
      type: object
      required: [monedaPreferida, ventanaProyeccionDias, monedaEfectiva, ventanaEfectivaDias]
      properties:
        monedaPreferida:
          type: [string, 'null']
          enum: [PEN, USD, null]
        ventanaProyeccionDias:
          type: [integer, 'null']
          enum: [7, 10, 15, null]
        monedaEfectiva: { $ref: '#/components/schemas/Moneda' }
        ventanaEfectivaDias: { type: integer, enum: [7, 10, 15] }
    ConfiguracionEmpresa:
      type: object
      required: [razonSocial, ruc, correoAdministrativo, monedaPorDefecto, version]
      properties:
        razonSocial: { type: string }
        ruc: { type: string }
        correoAdministrativo: { type: string }
        monedaPorDefecto: { $ref: '#/components/schemas/Moneda' }
        version: { type: integer }
    SolicitudConfiguracionEmpresa:
      type: object
      required: [version]
      additionalProperties: false
      minProperties: 2
      properties:
        correoAdministrativo: { $ref: '#/components/schemas/Correo' }
        monedaPorDefecto: { $ref: '#/components/schemas/Moneda' }
        version: { type: integer, minimum: 1 }
    MiembroListaCopias:
      type: object
      required: [usuarioId, correo, rol, estado, recibeCopias, agregadoEn]
      properties:
        usuarioId: { type: integer, format: int64 }
        correo: { type: string }
        rol: { $ref: '#/components/schemas/Rol' }
        estado: { $ref: '#/components/schemas/EstadoUsuario' }
        recibeCopias: { type: boolean, description: 'false si está DESACTIVADO o es OPERADOR (se muestra como inactivo).' }
        agregadoEn: { type: string, format: date-time }
    ListasCopias:
      type: object
      required: [porCobrar, porPagar]
      properties:
        porCobrar: { type: array, items: { $ref: '#/components/schemas/MiembroListaCopias' } }
        porPagar: { type: array, items: { $ref: '#/components/schemas/MiembroListaCopias' } }
    SolicitudAgregarCopia:
      type: object
      required: [usuarioId]
      additionalProperties: false
      properties:
        usuarioId: { type: integer, format: int64, minimum: 1 }

    # ── Contactos ──
    Contacto:
      type: object
      required: [id, nombre, correo, telefono, direccion, estado, tieneComprobantes, creadoEn, actualizadoEn, version]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        correo: { type: string }
        telefono: { type: [string, 'null'] }
        direccion: { type: [string, 'null'] }
        estado: { $ref: '#/components/schemas/EstadoContacto' }
        tieneComprobantes: { type: boolean, description: Incluye anulados; si es true no puede eliminarse. }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
        version: { type: integer }
    PaginaContactos:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos: { type: array, items: { $ref: '#/components/schemas/Contacto' } }
        paginacion: { $ref: '#/components/schemas/Paginacion' }
    SolicitudContacto:
      type: object
      required: [nombre, correo]
      additionalProperties: false
      properties:
        nombre: { type: string, description: 'RN-162: TRIM, un espacio interno, MAYÚSCULAS, 1 a 250, al menos una letra.' }
        correo: { $ref: '#/components/schemas/Correo' }
        telefono: { type: [string, 'null'], description: 'Opcional; TRIM; 1 a 30 caracteres: dígitos, espacios y + - ( ). Vacío equivale a null.' }
        direccion: { type: [string, 'null'], description: 'Opcional; TRIM; 1 a 250 caracteres. Vacío equivale a null.' }
    SolicitudEdicionContacto:
      type: object
      required: [version]
      additionalProperties: false
      minProperties: 2
      properties:
        nombre: { type: string }
        correo: { $ref: '#/components/schemas/Correo' }
        telefono: { type: [string, 'null'] }
        direccion: { type: [string, 'null'] }
        version: { type: integer, minimum: 1 }

    # ── Comprobantes y cuotas ──
    CuotaEntrada:
      type: object
      required: [numero, importe, fechaVencimiento]
      additionalProperties: false
      properties:
        numero: { type: integer, minimum: 1, maximum: 120 }
        importe: { $ref: '#/components/schemas/Importe' }
        fechaVencimiento: { type: string, format: date }
    SolicitudPropuestaCuotas:
      type: object
      required: [total, moneda, fechaEmision, modalidad]
      additionalProperties: false
      properties:
        total: { $ref: '#/components/schemas/Importe' }
        moneda: { $ref: '#/components/schemas/Moneda' }
        fechaEmision: { type: string, format: date }
        modalidad: { $ref: '#/components/schemas/Modalidad' }
        cantidadCuotas: { type: integer, minimum: 2, maximum: 120, description: Obligatorio con CUOTAS. }
        fechaVencimiento: { type: string, format: date, description: Obligatorio con PAGO_UNICO. }
    PropuestaCuotas:
      type: object
      required: [cuotas]
      properties:
        cuotas:
          type: array
          items:
            type: object
            required: [numero, importe, fechaVencimiento]
            properties:
              numero: { type: integer }
              importe: { $ref: '#/components/schemas/ImporteRespuesta' }
              fechaVencimiento: { type: string, format: date }
    SolicitudComprobante:
      type: object
      required: [contactoId, sentido, numeroDocumento, moneda, total, fechaEmision, modalidad, cuotas]
      additionalProperties: false
      properties:
        contactoId: { type: integer, format: int64, minimum: 1 }
        sentido: { $ref: '#/components/schemas/Sentido' }
        numeroDocumento: { type: string, description: 'TRIM y MAYÚSCULAS; 1 a 30; letras, dígitos, - y _; sin espacios.' }
        moneda: { $ref: '#/components/schemas/Moneda' }
        total: { $ref: '#/components/schemas/Importe' }
        fechaEmision: { type: string, format: date }
        modalidad: { $ref: '#/components/schemas/Modalidad' }
        cuotas:
          type: array
          minItems: 1
          maxItems: 120
          description: PAGO_UNICO exige 1 cuota; CUOTAS, de 2 a 120. Suma igual al total.
          items: { $ref: '#/components/schemas/CuotaEntrada' }
    SolicitudEdicionComprobante:
      type: object
      required: [version]
      additionalProperties: false
      minProperties: 2
      properties:
        contactoId: { type: integer, format: int64, minimum: 1 }
        numeroDocumento: { type: string }
        moneda: { $ref: '#/components/schemas/Moneda' }
        total: { $ref: '#/components/schemas/Importe' }
        fechaEmision: { type: string, format: date }
        modalidad: { $ref: '#/components/schemas/Modalidad' }
        cuotas:
          type: array
          minItems: 1
          maxItems: 120
          items: { $ref: '#/components/schemas/CuotaEntrada' }
        version: { type: integer, minimum: 1 }
    Cuota:
      type: object
      required: [id, numero, importe, saldo, vencimientoOriginal, fechaEfectivaVencimiento, estado, diasAtraso, reprogramada, version]
      properties:
        id: { type: integer, format: int64 }
        numero: { type: integer }
        importe: { $ref: '#/components/schemas/ImporteRespuesta' }
        saldo:
          description: null si la cuota está ANULADA (sin estado de pago vigente).
          oneOf:
            - $ref: '#/components/schemas/ImporteRespuesta'
            - type: 'null'
        vencimientoOriginal: { type: string, format: date }
        fechaEfectivaVencimiento: { type: string, format: date, description: Fecha de la promesa ACTIVA o vencimiento original (RN-071). }
        estado: { $ref: '#/components/schemas/EstadoCuota' }
        diasAtraso: { type: integer, minimum: 0 }
        reprogramada: { type: boolean }
        version: { type: integer }
    DetalleCuota:
      allOf:
        - $ref: '#/components/schemas/Cuota'
        - type: object
          required: [comprobanteId, numeroDocumento, sentido, contacto, moneda, fechaMinimaPago, fechaCalculo]
          properties:
            comprobanteId: { type: integer, format: int64 }
            numeroDocumento: { type: string }
            sentido: { $ref: '#/components/schemas/Sentido' }
            contacto: { $ref: '#/components/schemas/ContactoResumen' }
            moneda: { $ref: '#/components/schemas/Moneda' }
            fechaMinimaPago: { type: string, format: date }
            fechaCalculo: { type: string, format: date }
    Anulacion:
      type: object
      required: [id, motivo, anuladoPor, anuladoEn]
      properties:
        id: { type: integer, format: int64 }
        motivo: { type: string }
        anuladoPor: { $ref: '#/components/schemas/ReferenciaUsuario' }
        anuladoEn: { type: string, format: date-time }
    ComprobanteResumen:
      type: object
      required: [id, contacto, sentido, numeroDocumento, moneda, total, saldo, fechaEmision, cantidadCuotas, estado]
      properties:
        id: { type: integer, format: int64 }
        contacto: { $ref: '#/components/schemas/ContactoResumen' }
        sentido: { $ref: '#/components/schemas/Sentido' }
        numeroDocumento: { type: string }
        moneda: { $ref: '#/components/schemas/Moneda' }
        total: { $ref: '#/components/schemas/ImporteRespuesta' }
        saldo:
          oneOf:
            - $ref: '#/components/schemas/ImporteRespuesta'
            - type: 'null'
        fechaEmision: { type: string, format: date }
        cantidadCuotas: { type: integer }
        estado: { $ref: '#/components/schemas/EstadoComprobante' }
    PaginaComprobantes:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos: { type: array, items: { $ref: '#/components/schemas/ComprobanteResumen' } }
        paginacion: { $ref: '#/components/schemas/Paginacion' }
    Comprobante:
      type: object
      required: [id, contacto, sentido, numeroDocumento, moneda, total, saldo, fechaEmision, modalidad, estado, editable, anulable, anulacion, cuotas, fechaCalculo, creadoPor, creadoEn, version]
      properties:
        id: { type: integer, format: int64 }
        contacto: { $ref: '#/components/schemas/ContactoResumen' }
        sentido: { $ref: '#/components/schemas/Sentido' }
        numeroDocumento: { type: string }
        moneda: { $ref: '#/components/schemas/Moneda' }
        total: { $ref: '#/components/schemas/ImporteRespuesta' }
        saldo:
          oneOf:
            - $ref: '#/components/schemas/ImporteRespuesta'
            - type: 'null'
        fechaEmision: { type: string, format: date }
        modalidad: { $ref: '#/components/schemas/Modalidad' }
        estado: { $ref: '#/components/schemas/EstadoComprobante' }
        editable: { type: boolean }
        anulable: { type: boolean }
        anulacion:
          oneOf:
            - $ref: '#/components/schemas/Anulacion'
            - type: 'null'
        cuotas: { type: array, items: { $ref: '#/components/schemas/Cuota' } }
        fechaCalculo: { type: string, format: date }
        creadoPor: { $ref: '#/components/schemas/ReferenciaUsuario' }
        creadoEn: { type: string, format: date-time }
        version: { type: integer }
    SolicitudAnulacion:
      type: object
      required: [motivo]
      additionalProperties: false
      properties:
        motivo: { type: string, description: 'TRIM (incluye tabulaciones, saltos de línea y NBSP), MAYÚSCULAS, espacios internos conservados, 1 a 500.' }

    # ── Pagos ──
    SolicitudPago:
      type: object
      required: [importe, moneda, fechaPago, versionCuota]
      additionalProperties: false
      properties:
        importe: { $ref: '#/components/schemas/Importe' }
        moneda: { $ref: '#/components/schemas/Moneda' }
        fechaPago: { type: string, format: date }
        versionCuota: { type: integer, minimum: 1 }
    Pago:
      type: object
      required: [id, cuotaId, importe, moneda, fechaPago, estado, registradoPor, creadoEn, anulacion]
      properties:
        id: { type: integer, format: int64 }
        cuotaId: { type: integer, format: int64 }
        importe: { $ref: '#/components/schemas/ImporteRespuesta' }
        moneda: { $ref: '#/components/schemas/Moneda' }
        fechaPago: { type: string, format: date }
        estado: { $ref: '#/components/schemas/EstadoPago' }
        registradoPor: { $ref: '#/components/schemas/ReferenciaUsuario' }
        creadoEn: { type: string, format: date-time }
        anulacion:
          oneOf:
            - $ref: '#/components/schemas/Anulacion'
            - type: 'null'
    EstadoCuotaResumen:
      type: object
      required: [id, saldo, estado, version]
      properties:
        id: { type: integer, format: int64 }
        saldo: { $ref: '#/components/schemas/ImporteRespuesta' }
        estado: { $ref: '#/components/schemas/EstadoCuota' }
        version: { type: integer }
    RespuestaPago:
      type: object
      required: [pago, cuota]
      properties:
        pago: { $ref: '#/components/schemas/Pago' }
        cuota: { $ref: '#/components/schemas/EstadoCuotaResumen' }
    RespuestaAnulacionPago:
      type: object
      required: [anulacion, pagoId, cuota]
      properties:
        anulacion: { $ref: '#/components/schemas/Anulacion' }
        pagoId: { type: integer, format: int64 }
        cuota: { $ref: '#/components/schemas/EstadoCuotaResumen' }

    # ── Reprogramaciones ──
    PromesaPago:
      type: object
      required: [id, fechaPrometida, estado, registradaPor, registradaEn]
      properties:
        id: { type: integer, format: int64 }
        fechaPrometida: { type: string, format: date }
        estado: { $ref: '#/components/schemas/EstadoPromesa' }
        registradaPor: { $ref: '#/components/schemas/ReferenciaUsuario' }
        registradaEn: { type: string, format: date-time }
    SolicitudReprogramacion:
      type: object
      required: [fechaPrometida, versionCuota]
      additionalProperties: false
      properties:
        fechaPrometida: { type: string, format: date, description: 'AAAA-MM-DD; una fecha inexistente (2026-02-30) se rechaza con 422.' }
        versionCuota: { type: integer, minimum: 1 }
    RespuestaReprogramacion:
      type: object
      required: [promesa, cuota]
      properties:
        promesa: { $ref: '#/components/schemas/PromesaPago' }
        cuota:
          type: object
          required: [id, vencimientoOriginal, fechaEfectivaVencimiento, estado, reprogramada, version]
          properties:
            id: { type: integer, format: int64 }
            vencimientoOriginal: { type: string, format: date }
            fechaEfectivaVencimiento: { type: string, format: date }
            estado: { $ref: '#/components/schemas/EstadoCuota' }
            reprogramada: { type: boolean }
            version: { type: integer }

    # ── Panel ──
    MovimientoCuota:
      type: object
      required: [cuotaId, comprobanteId, numeroDocumento, sentido, contacto, numeroCuota, totalCuotas, moneda, importe, saldo, vencimientoOriginal, fechaEfectivaVencimiento, estado, diasAtraso, reprogramada, comprobanteAnulado]
      properties:
        cuotaId: { type: integer, format: int64 }
        comprobanteId: { type: integer, format: int64 }
        numeroDocumento: { type: string }
        sentido: { $ref: '#/components/schemas/Sentido' }
        contacto: { $ref: '#/components/schemas/ContactoResumen' }
        numeroCuota: { type: integer }
        totalCuotas: { type: integer }
        moneda: { $ref: '#/components/schemas/Moneda' }
        importe: { $ref: '#/components/schemas/ImporteRespuesta' }
        saldo:
          oneOf:
            - $ref: '#/components/schemas/ImporteRespuesta'
            - type: 'null'
        vencimientoOriginal: { type: string, format: date }
        fechaEfectivaVencimiento: { type: string, format: date }
        estado: { $ref: '#/components/schemas/EstadoCuota' }
        diasAtraso: { type: integer, minimum: 0 }
        reprogramada: { type: boolean }
        comprobanteAnulado: { type: boolean }
    PanelCartera:
      type: object
      required: [corte, fechaCalculo, moneda, origenMoneda, otraMoneda, indicadores, proyeccion, incluyeAnulados, movimientos]
      properties:
        corte: { type: string, format: date-time, description: 'Momento de corte; la interfaz muestra «Datos al DD/MM/AAAA, HH:mm».' }
        fechaCalculo: { type: string, format: date }
        moneda: { $ref: '#/components/schemas/Moneda' }
        origenMoneda: { type: string, enum: [CONSULTA, PREFERENCIA_USUARIO, EMPRESA] }
        otraMoneda:
          type: object
          required: [moneda, tieneCuotasVencidas]
          properties:
            moneda: { $ref: '#/components/schemas/Moneda' }
            tieneCuotasVencidas: { type: boolean }
        indicadores:
          type: object
          required: [vencidaPorCobrar, vencidaPorPagar, pendienteCobro, pendientePago]
          properties:
            vencidaPorCobrar: { $ref: '#/components/schemas/ImporteRespuesta' }
            vencidaPorPagar: { $ref: '#/components/schemas/ImporteRespuesta' }
            pendienteCobro: { $ref: '#/components/schemas/ImporteRespuesta' }
            pendientePago: { $ref: '#/components/schemas/ImporteRespuesta' }
        proyeccion:
          type: object
          required: [ventanaDias, dias]
          properties:
            ventanaDias: { type: integer, enum: [7, 10, 15] }
            dias:
              type: array
              items:
                type: object
                required: [fecha, cobros, pagos]
                properties:
                  fecha: { type: string, format: date }
                  cobros: { $ref: '#/components/schemas/ImporteRespuesta' }
                  pagos: { $ref: '#/components/schemas/ImporteRespuesta' }
        incluyeAnulados: { type: boolean }
        movimientos: { type: array, items: { $ref: '#/components/schemas/MovimientoCuota' } }
    TiempoPromedioCobro:
      type: object
      required: [mes, mesEnCurso, sinDatos, valorDias, cantidadComprobantes, corte, fechaCalculo]
      properties:
        mes: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        mesEnCurso: { type: boolean, description: true → la interfaz muestra «Mes en curso — datos parciales». }
        sinDatos: { type: boolean }
        valorDias:
          type: [string, 'null']
          pattern: '^[0-9]+\.[0-9]{2}$'
        cantidadComprobantes: { type: integer, minimum: 0 }
        corte: { type: string, format: date-time }
        fechaCalculo: { type: string, format: date }

    # ── Historial compartido de cuota (HU-017; RN-078) ──
    HistorialCuota:
      type: object
      additionalProperties: false
      required: [cuotaId, moneda, corte, fechaCalculo, eventos]
      properties:
        cuotaId: { type: integer, format: int64 }
        moneda: { $ref: '#/components/schemas/Moneda' }
        corte: { type: string, format: date-time }
        fechaCalculo: { type: string, format: date }
        eventos:
          type: array
          description: Todos los hechos conservados y las transiciones recalculadas, ordenados según RN-078.
          items: { $ref: '#/components/schemas/EventoHistorialCuota' }
    EventoHistorialCuota:
      type: object
      additionalProperties: false
      required: [tipo, fechaHecho, registroId, registradaEn, registradaPor, importe, anulado, fechaAnterior, fechaNueva, cambios]
      properties:
        tipo:
          type: string
          enum: [EMISION, EDICION, REPROGRAMACION, PAGO, ANULACION_PAGO, VENCIDA, CANCELADA, REAPERTURA]
        fechaHecho:
          type: string
          format: date
          description: Fecha del hecho; pagos por fecha de pago, anulaciones/ediciones/reprogramaciones por su fecha de negocio en America/Lima, emisión por fecha de emisión y transiciones según RN-078.
        registroId:
          type: [integer, 'null']
          format: int64
          description: Identificador del registro de origen, interpretado junto con tipo; null para transiciones derivadas.
        registradaEn:
          type: [string, 'null']
          format: date-time
          description: Fecha/hora informativa de registro; obligatoria para hechos de usuario. Null en emisión sin dato de registro y transiciones derivadas.
        registradaPor:
          description: Actor del hecho; null para emisión sin dato y transiciones derivadas.
          oneOf:
            - { $ref: '#/components/schemas/ReferenciaUsuario' }
            - { type: 'null' }
        importe:
          description: Importe del pago o de su anulación en la moneda de la cuota; null en los otros tipos.
          oneOf:
            - { $ref: '#/components/schemas/ImporteRespuesta' }
            - { type: 'null' }
        anulado:
          type: boolean
          description: True solo para un evento PAGO cuyo registro tiene anulación; el evento y su importe permanecen.
        fechaAnterior: { type: [string, 'null'], format: date, description: Fecha efectiva previa a la reprogramación; null en los otros tipos. }
        fechaNueva: { type: [string, 'null'], format: date, description: Nueva fecha prometida; null en los otros tipos. }
        cambios:
          type: array
          description: Cambios por campo de EDICION, incluido el valor anterior y nuevo; vacío en otros tipos. Los valores personales solo se devuelven en esta consulta autorizada y nunca se registran en logs.
          items:
            type: object
            additionalProperties: false
            required: [campo, valorAnterior, valorNuevo]
            properties:
              campo: { type: string }
              valorAnterior: { type: [string, 'null'] }
              valorNuevo: { type: [string, 'null'] }
      allOf:
        - if:
            properties: { tipo: { enum: [EDICION, REPROGRAMACION, PAGO, ANULACION_PAGO] } }
          then:
            properties:
              registroId: { type: integer }
              registradaEn: { type: string, format: date-time }
              registradaPor: { $ref: '#/components/schemas/ReferenciaUsuario' }
        - if:
            properties: { tipo: { enum: [PAGO, ANULACION_PAGO] } }
          then:
            properties:
              importe: { $ref: '#/components/schemas/ImporteRespuesta' }
          else:
            properties: { importe: { type: 'null' } }
        - if:
            properties: { tipo: { const: REPROGRAMACION } }
          then:
            properties:
              fechaAnterior: { type: string, format: date }
              fechaNueva: { type: string, format: date }
          else:
            properties:
              fechaAnterior: { type: 'null' }
              fechaNueva: { type: 'null' }
        - if:
            properties: { tipo: { const: EDICION } }
          then:
            properties: { cambios: { minItems: 1 } }
          else:
            properties: { cambios: { maxItems: 0 } }
        - if:
            properties: { tipo: { enum: [VENCIDA, CANCELADA, REAPERTURA] } }
          then:
            properties:
              registroId: { type: 'null' }
              registradaEn: { type: 'null' }
              registradaPor: { type: 'null' }
        - if:
            properties: { tipo: { not: { const: PAGO } } }
          then:
            properties: { anulado: { const: false } }

    # ── Avisos ──
    CuotaPorAvisar:
      type: object
      required: [cuotaId, comprobanteId, numeroDocumento, numeroCuota, sentido, contacto, moneda, saldo, fechaEfectivaVencimiento, estado, diasAtraso, tipoAviso, ultimoAviso, estadoAviso, intentoEnProcesoId, promesaActiva]
      properties:
        cuotaId: { type: integer, format: int64 }
        comprobanteId: { type: integer, format: int64 }
        numeroDocumento: { type: string }
        numeroCuota: { type: integer }
        sentido: { $ref: '#/components/schemas/Sentido' }
        contacto: { $ref: '#/components/schemas/ContactoResumen' }
        moneda: { $ref: '#/components/schemas/Moneda' }
        saldo: { $ref: '#/components/schemas/ImporteRespuesta' }
        fechaEfectivaVencimiento: { type: string, format: date }
        estado: { type: string, enum: [PENDIENTE, VENCIDA] }
        diasAtraso: { type: integer, minimum: 0 }
        tipoAviso: { $ref: '#/components/schemas/TipoAviso' }
        ultimoAviso:
          oneOf:
            - type: object
              required: [enviadoEn, enviadoPor, mismaFechaYTipo]
              properties:
                enviadoEn: { type: string, format: date-time }
                enviadoPor: { $ref: '#/components/schemas/ReferenciaUsuario' }
                mismaFechaYTipo: { type: boolean, description: true → exige confirmar «Reenviar aviso». }
            - type: 'null'
        estadoAviso: { type: string, enum: [ENVIANDO, ENVIADO, NO_ENVIADO], description: 'ENVIANDO si hay plazo vigente; ENVIADO si hay éxito para el tipo y vencimiento vigentes; NO_ENVIADO en otro caso. Un fallo posterior conserva el éxito previo.' }
        intentoEnProcesoId: { type: [integer, 'null'], format: int64, description: Solo mientras el plazo del intento sigue vigente; null después del cierre o vencimiento. }
        promesaActiva:
          description: Solo con S1 entregada y promesa clasificada ACTIVA al corte de la consulta; visible para todos los roles de su empresa. Null sin S1 o si no hay promesa activa.
          oneOf:
            - type: object
              required: [fechaPrometida, registradaPor]
              properties:
                fechaPrometida: { type: string, format: date }
                registradaPor: { $ref: '#/components/schemas/ReferenciaUsuario' }
            - type: 'null'
    ListaCuotasPorAvisar:
      type: object
      required: [corte, fechaCalculo, cuotas]
      properties:
        corte: { type: string, format: date-time }
        fechaCalculo: { type: string, format: date }
        cuotas: { type: array, items: { $ref: '#/components/schemas/CuotaPorAvisar' } }
    Destinatarios:
      type: object
      required: [para, copias, responderA]
      properties:
        para: { type: array, items: { type: string } }
        copias: { type: array, items: { type: string }, description: Sin duplicados. }
        responderA: { type: string }
    SolicitudVistaPreviaAviso:
      type: object
      required: [cuotaIds]
      additionalProperties: false
      properties:
        cuotaIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: integer, format: int64, minimum: 1 }
        comentario: { type: [string, 'null'], description: 'Opcional; TRIM y MAYÚSCULAS; máximo 500; solo espacios = sin comentario.' }
    VistaPreviaAviso:
      type: object
      required: [correos, cuotasExcluidas, cuotasConAvisoPrevio, firmaDestinatarios]
      properties:
        correos:
          type: array
          items:
            type: object
            required: [contacto, tipoAviso, cuotaIds, destinatarios]
            properties:
              contacto: { $ref: '#/components/schemas/ContactoResumen' }
              tipoAviso: { $ref: '#/components/schemas/TipoAviso' }
              cuotaIds: { type: array, items: { type: integer, format: int64 } }
              destinatarios: { $ref: '#/components/schemas/Destinatarios' }
        cuotasExcluidas:
          type: array
          items: { $ref: '#/components/schemas/CuotaExcluida' }
        cuotasConAvisoPrevio:
          type: array
          items:
            type: object
            required: [cuotaId, enviadoEn, enviadoPor]
            properties:
              cuotaId: { type: integer, format: int64 }
              enviadoEn: { type: string, format: date-time }
              enviadoPor: { $ref: '#/components/schemas/ReferenciaUsuario' }
        firmaDestinatarios: { type: string, description: 'Firma opaca del servidor sobre la selección, tipos y destinatarios mostrados; permite validar los destinatarios de los grupos sobrevivientes sin invalidarse solo por excluir cuotas no aptas.' }
    CuotaExcluida:
      type: object
      required: [cuotaId, motivo]
      properties:
        cuotaId: { type: integer, format: int64 }
        motivo: { type: string, enum: [CUOTA_CANCELADA, COMPROBANTE_ANULADO, SIN_SALDO] }
    SolicitudEnvioAviso:
      type: object
      required: [cuotaIds, firmaDestinatarios]
      additionalProperties: false
      properties:
        cuotaIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: integer, format: int64, minimum: 1 }
        comentario: { type: [string, 'null'] }
        firmaDestinatarios: { type: string }
        confirmarReenvio: { type: boolean, default: false }
    CuotaAvisada:
      type: object
      required: [cuotaId, numeroDocumento, numeroCuota, fechaEfectivaVencimiento, moneda, saldoAlEnvio]
      properties:
        cuotaId: { type: integer, format: int64 }
        numeroDocumento: { type: string }
        numeroCuota: { type: integer }
        fechaEfectivaVencimiento: { type: string, format: date }
        moneda: { $ref: '#/components/schemas/Moneda' }
        saldoAlEnvio: { $ref: '#/components/schemas/ImporteRespuesta' }
    IntentoAviso:
      type: object
      required: [id, estado, tipoAviso, contacto, cuotas, comentario, destinatarios, creadoPor, creadoEn, resueltoEn, motivoNoEnvio]
      properties:
        id: { type: integer, format: int64 }
        estado: { $ref: '#/components/schemas/EstadoIntento' }
        tipoAviso: { $ref: '#/components/schemas/TipoAviso' }
        contacto: { $ref: '#/components/schemas/ContactoResumen' }
        cuotas: { type: array, items: { $ref: '#/components/schemas/CuotaAvisada' } }
        comentario: { type: [string, 'null'] }
        destinatarios: { $ref: '#/components/schemas/Destinatarios' }
        creadoPor: { $ref: '#/components/schemas/ReferenciaUsuario' }
        creadoEn: { type: string, format: date-time }
        resueltoEn: { type: [string, 'null'], format: date-time, description: Instante de cierre; al proyectar un intento vencido sin cierre persistente es creadoEn + 10 s. }
        motivoNoEnvio:
          type: [string, 'null']
          enum: [RECHAZO_PROVEEDOR, TIEMPO_ESPERA, ERROR_COMUNICACION, ERROR_REGISTRO, INTERRUPCION_PROCESO, null]
          description: Obligatorio y no nulo en NO_ENVIADO; null en EN_PROCESO o ENVIADO. Un vencimiento sin resultado registrado se proyecta con TIEMPO_ESPERA.
    RespuestaEnvioAviso:
      type: object
      required: [intentos, cuotasExcluidas]
      properties:
        intentos: { type: array, items: { $ref: '#/components/schemas/IntentoAviso' } }
        cuotasExcluidas: { type: array, items: { $ref: '#/components/schemas/CuotaExcluida' } }
    PaginaIntentosAviso:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos: { type: array, items: { $ref: '#/components/schemas/IntentoAviso' } }
        paginacion: { $ref: '#/components/schemas/Paginacion' }
